<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地科群島｜學測地科闖關</title>
<style>
:root{--ink:#16323f;--muted:#5e7a85;--paper:#ffffff;--line:#d9e6ea;--sea1:#bfe9ee;--sea2:#e9f7f5;--accent:#0b7f95;--accent-ink:#fff;--soft:#eef7f7;--ok:#1c8a55;--bad:#c2452f;--gold:#e5a13a;--shadow:0 10px 28px rgba(18,60,74,.14)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);background:linear-gradient(var(--sea1),var(--sea2) 55%);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;line-height:1.7;min-height:100vh}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:rgba(255,255,255,.93);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:10px;background:none;padding:0;color:inherit;text-align:left}
.brand b{font-size:18px;letter-spacing:.06em}
.brand small{display:block;font-size:11px;color:var(--muted)}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:linear-gradient(135deg,#9fe0d2,#0c9dba)}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink)}
.pill:hover{background:var(--soft)}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.banner{border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;margin-bottom:12px}
.banner.due{background:#fff3d9;border:1px solid #f0cf8a;color:#7a4d00}
.banner.debug{background:#ffe4de;border:1px solid #f1a999;color:#8a2412}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--accent)}
.stat span{font-size:12px;color:var(--muted)}
h1{font-size:clamp(22px,4.5vw,32px);margin:6px 0 4px;letter-spacing:.02em}
.lead{margin:0 0 14px;color:var(--muted);font-size:14px}
/* 島嶼地圖 */
.map{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.isle{grid-column:span 2;position:relative;border-radius:46% 54% 52% 48%/55% 46% 54% 45%;min-height:190px;padding:26px 18px 22px;color:#fff;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .18s;overflow:hidden}
.isle:nth-child(4),.isle:nth-child(5){grid-column:span 3}
.isle:not(.locked):hover{transform:translateY(-4px) scale(1.02)}
.isle .ico{font-size:40px;line-height:1.1}
.isle b{font-size:19px;letter-spacing:.08em}
.isle small{font-size:12px;opacity:.92}
.isle .prog{margin-top:6px;font-size:12px;font-weight:700;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 12px}
.isle.locked{filter:grayscale(.75) brightness(.95);cursor:not-allowed;opacity:.8}
.isle.hasdue{animation:pulse 1.4s infinite}
.isle .crown{position:absolute;top:10px;right:22%;font-size:22px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,161,58,.85),var(--shadow)}50%{box-shadow:0 0 0 12px rgba(229,161,58,0),var(--shadow)}}
/* 五島主題 */
.t-ast{--c1:#1b1b4b;--c2:#5a3d9a;--accent:#5a3d9a;--soft:#f0ecfa;background:radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 30%,#fff 0 1.2px,transparent 2px),radial-gradient(circle at 45% 75%,#ffe9a8 0 1.4px,transparent 2.4px),radial-gradient(circle at 85% 70%,#fff 0 1px,transparent 2px),linear-gradient(140deg,var(--c1),var(--c2))}
.t-atm{--c1:#3d9be0;--c2:#a7dcf7;--accent:#1f7fc4;--soft:#e8f4fd;background:radial-gradient(ellipse at 25% 30%,rgba(255,255,255,.75) 0 14%,transparent 15%),radial-gradient(ellipse at 72% 68%,rgba(255,255,255,.6) 0 12%,transparent 13%),linear-gradient(160deg,var(--c1),var(--c2))}
.t-geo{--c1:#7a4a22;--c2:#c48a4a;--accent:#8a5524;--soft:#f8efe3;background:repeating-linear-gradient(168deg,rgba(255,255,255,.14) 0 6px,transparent 6px 22px),linear-gradient(150deg,var(--c1),var(--c2))}
.t-ocn{--c1:#075a78;--c2:#1fb3b3;--accent:#087f8f;--soft:#e3f6f5;background:repeating-radial-gradient(ellipse at 50% 120%,rgba(255,255,255,.16) 0 4px,transparent 4px 18px),linear-gradient(160deg,var(--c1),var(--c2))}
.t-env{--c1:#8f2a1c;--c2:#ef8a3c;--accent:#b6421f;--soft:#fdeee4;background:radial-gradient(circle at 50% 110%,rgba(255,220,120,.55) 0 30%,transparent 31%),linear-gradient(155deg,var(--c1),var(--c2))}
/* 島內 */
.hero{border-radius:22px;padding:22px 20px;color:#fff;box-shadow:var(--shadow);margin-bottom:16px}
.hero h2{margin:0;font-size:24px;letter-spacing:.06em}
.hero p{margin:4px 0 0;font-size:14px;opacity:.95}
.levels{display:grid;gap:12px}
.lv{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left;width:100%;color:inherit;transition:border-color .15s,transform .15s}
.lv:hover{border-color:var(--accent);transform:translateX(3px)}
.lv .num{flex:0 0 46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:var(--accent);font-size:20px}
.lv.done .num{background:var(--ok)}
.lv.due{border-color:var(--gold);animation:pulse 1.4s infinite}
.lv b{display:block;font-size:17px}
.lv small{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;margin-left:6px;vertical-align:middle;background:var(--soft);color:var(--accent)}
.tag.gold{background:#fff3d9;color:#8a5a00}
.tag.ok{background:#e2f5ea;color:var(--ok)}
/* 關卡內容 */
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:19px;color:var(--accent)}
.card h4{margin:14px 0 4px;font-size:15px}
.card ul{margin:4px 0;padding-left:20px}
.card li{margin:3px 0;font-size:15px}
.trap{background:#fff7e8;border-left:4px solid var(--gold);border-radius:10px;padding:8px 12px;margin-top:10px;font-size:14px}
.btn{background:var(--accent);color:#fff;border-radius:14px;padding:12px 22px;font-weight:800;font-size:16px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent)}
.btn.bad{background:#fff;color:var(--bad);border:2px solid var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps i{flex:1;height:7px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--accent)}
.steps i.ok{background:var(--ok)}
.steps i.no{background:var(--bad)}
.q{font-size:17px;font-weight:700;margin:4px 0 12px}
.src{font-size:12px;color:var(--muted);margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;font-size:16px;color:inherit}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--soft)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:#e9f8ef}
.opt.wrong{border-color:var(--bad);background:#fdece8}
.why{font-size:13.5px;border-radius:10px;padding:6px 10px;margin:-2px 0 8px;background:#f5f8f9;color:#3d5560}
.why.right{background:#e9f8ef;color:#12613a}
.result{text-align:center}
.result .big{font-size:60px;line-height:1.1}
.result h3{font-size:24px;margin:6px 0}
.badge{display:inline-grid;place-items:center;width:110px;height:110px;border-radius:50%;font-size:50px;color:#fff;background:conic-gradient(from 0deg,var(--gold),#ffe19c,var(--gold));box-shadow:0 0 0 8px #fff,0 8px 24px rgba(0,0,0,.18);margin:8px 0;animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.3) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
table.sched{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.sched td,table.sched th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px;font:13px/1.5 ui-monospace,Consolas,monospace}
.foot{margin-top:26px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:640px){
  .map{grid-template-columns:repeat(2,1fr);gap:10px}
  .isle,.isle:nth-child(4),.isle:nth-child(5){grid-column:span 1;min-height:150px;padding:18px 10px}
  .isle:nth-child(5){grid-column:span 2}
  .isle .ico{font-size:32px}.isle b{font-size:16px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 第二版畫面：立體感群島＋貓島民（參考政策島的版面配置） ===== */
:root{--cream:#fbf3ec;--card:#fffaf5;--ink:#1f1a17;--muted:#7a6f66;--line:#eadfd3;--orange:#e0673a}
body{background:var(--cream)}
.top{background:rgba(251,243,236,.94);border-bottom:1px solid var(--line)}
.brand b{letter-spacing:.12em}
.logo{background:var(--orange);color:#fff;font-weight:900;font-size:13px;letter-spacing:.02em}
.pill{border-color:var(--line);background:var(--card)}
.wrap.wide{max-width:1280px}
.world{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.scene-box{position:relative;border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:0 14px 34px rgba(60,40,20,.12);background:#c9d6ad}
.scene-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scene{display:block;width:100%;min-width:700px;height:auto}
.scene-brand{position:absolute;left:14px;top:14px;background:rgba(255,250,245,.93);border-radius:16px;padding:10px 14px;line-height:1.15;box-shadow:0 4px 14px rgba(60,40,20,.12);pointer-events:none}
.scene-brand i{display:block;font-style:normal;font-weight:900;font-size:22px;color:var(--orange);letter-spacing:.02em}
.scene-brand b{font-size:15px;letter-spacing:.2em}
.scene-hint{position:absolute;right:12px;bottom:10px;font-size:11px;background:rgba(255,250,245,.9);border-radius:99px;padding:3px 10px;color:var(--muted);pointer-events:none}
.tile{cursor:pointer;outline:none}
.tile.locked{cursor:not-allowed}
.tile .face{transition:filter .15s}
.tile:not(.locked):hover .face,.tile:focus-visible .face{filter:brightness(1.12)}
.tile:focus-visible .ring{stroke:#1f1a17;stroke-width:3}
.tile.due .ring{stroke:#f2b93b;stroke-width:4;animation:blink 1.1s infinite}
@keyframes blink{50%{stroke-opacity:.15}}
.bob{animation:bob 2.2s ease-in-out infinite}
.bob.b2{animation-delay:-.7s}.bob.b3{animation-delay:-1.4s}
@keyframes bob{50%{transform:translateY(-2.5px)}}
.emp{animation:hop 1.3s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
.boat{animation:sail 9s ease-in-out infinite alternate}
@keyframes sail{to{transform:translateX(26px)}}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:9px 14px;background:var(--card);border-top:1px solid var(--line);font-size:12.5px}
.legend b{letter-spacing:.12em;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.legend i{width:22px;height:0;border-top:3px dashed transparent;border-radius:2px;height:4px}
.lgbtn{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700;color:var(--ink)}
.flow{animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
.scene-hint{bottom:auto;top:12px}
.side{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px 16px;box-shadow:0 14px 34px rgba(60,40,20,.08)}
.side .eyebrow{font-size:11px;letter-spacing:.22em;color:var(--orange);font-weight:800}
.side h1{font-size:24px;margin:2px 0 4px}
.side .lead{margin:0 0 12px;font-size:13px}
.me{display:flex;gap:10px;align-items:center;border:1px solid #f1cdb9;background:#fff3ea;border-radius:16px;padding:10px 12px;margin-bottom:10px;width:100%;text-align:left;color:inherit}
.me b{display:block;font-size:15px}.me small{font-size:12.5px;color:var(--muted)}
.me.due{border-color:#f0cf8a;background:#fff3d9}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.mini div{text-align:center;border:1px solid var(--line);border-radius:12px;padding:6px 2px;background:#fff}
.mini b{display:block;font-size:17px;color:var(--orange)}.mini span{font-size:10.5px;color:var(--muted)}
.grp{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--muted);margin:14px 0 2px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:10px;width:100%;background:none;text-align:left;padding:9px 4px;border-bottom:1px solid var(--line);color:inherit}
.item:hover:not(:disabled){background:#fff3ea}
.item:disabled{opacity:.45;cursor:not-allowed}
.item .no{font:italic 700 20px Georgia,"Times New Roman",serif;color:var(--orange);flex:0 0 32px}
.item .nm{flex:1;font-size:14.5px;font-weight:700;line-height:1.35}
.item .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.item .st{font-size:11px;font-weight:800;border-radius:99px;padding:2px 8px;white-space:nowrap;background:#f3ece4;color:var(--muted)}
.item .st.ok{background:#e2f5ea;color:#1c8a55}.item .st.due{background:#fff3d9;color:#8a5a00}
.say{display:flex;gap:12px;align-items:flex-start;margin:0 0 14px}
.say .ava{flex:0 0 68px;width:68px;height:68px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;overflow:hidden}
.say .bub{position:relative;flex:1;background:#fff;border:1px solid var(--line);border-radius:6px 18px 18px 18px;padding:10px 14px;box-shadow:0 4px 12px rgba(60,40,20,.07)}
.say .bub b{font-size:12.5px;color:var(--accent)}
.say .bub p{margin:2px 0 0;font-size:15px}
.badge{background:conic-gradient(from 0deg,#f2b93b,#ffe9b0,#f2b93b);overflow:hidden}
.badge svg{background:#fffaf5;border-radius:50%}
.card{border-color:var(--line)}
@media (max-width:900px){.world{grid-template-columns:1fr}}
@media (max-width:640px){.scene-hint{display:none}.scene-brand i{font-size:17px}.scene-brand b{font-size:12px}.say .ava{flex-basis:54px;width:54px;height:54px}}
</style>
</head>
<body>
<header class="top">
  <button class="brand" id="homeBtn" aria-label="回到群島地圖"><span class="logo">🐾</span><span><b>地科群島</b><small>喵皇出巡・5 島 16 關</small></span></button>
  <button class="pill" id="saveBtn">💾 進度備份</button>
</header>
<main class="wrap" id="app"></main>

<!-- ============ 資料區：關卡內容（補題、校對只改這一段） ============ -->
<script id="geo-data">
const INTERVALS=[1,3,7,16,35]; // 第 1~5 次複習：自「週期基準日」累計的天數
const ISLANDS=[
{id:"ast",theme:"t-ast",icon:"🌌",name:"天文島",sub:"星空、恆星與曆法",ready:true,levels:[
 {id:"AST-01",name:"觀測尺度與望遠鏡",pages:"講義 p35-40",
  note:{core:["電磁波依波長由長到短：無線電波、紅外線、可見光、紫外線、X 光、γ 射線。","地球大氣只讓兩段波長順利通過，稱為「大氣窗」：可見光與無線電波。所以光學望遠鏡和電波望遠鏡可以蓋在地面。","紅外線會被水氣吸收，要放在乾燥的高山或太空；紫外線、X 光、γ 射線幾乎被高層大氣擋光，一定要上太空。","宇宙的階層由大到小：宇宙、星系群、星系、星團、恆星、行星、衛星。星雲是恆星誕生或死亡的場所，多半在自己的星系裡面。","距離單位：天文單位（AU，日地距離）用在太陽系內；光年與秒差距用在恆星與星系。1 秒差距約 3.26 光年。"],
   trap:["「高山、沙漠、沒有光害」只對可見光有幫助，擋不住大氣對 X 光的吸收。","梅西爾編號（M31、M42）只是目錄順序，和遠近無關。","看起來小不等於比較遠，要先判斷它是「星系」還是「銀河系裡的天體」。","星等數字越大越暗；多收 100 倍的光可以多看暗 5 等，約 2.512 倍多看 1 等。"]},
  qs:[
   {src:"講義 p17 第 5 題（96 學測）改寫・答案已對照講義答案頁",q:"天文台規劃了幾種望遠鏡。哪一組「非得送上太空」才能觀測？",opts:["可見光望遠鏡與無線電波望遠鏡","無線電波望遠鏡與紅外線望遠鏡","X 光望遠鏡與 γ 射線望遠鏡","可見光望遠鏡與紅外線望遠鏡"],ans:2,why:["這兩種波段剛好是大氣窗，地面就能觀測。","無線電波可穿過大氣；紅外線在乾燥高山也能做部分觀測，不是一定要上太空。","X 光與 γ 射線會被高層大氣完全吸收，地面收不到，只能上太空。","可見光在地面就能看；紅外線在高山可做部分觀測。"]},
   {src:"講義 p18 第 8 題（101 學測）改寫・答案已對照講義答案頁",q:"要觀測星系碰撞放出的 X 光，望遠鏡最適合放在哪裡？",opts:["視野遼闊的高原","沒有光害的高山","大氣擾動少的沙漠","繞地球的軌道上，並避開范艾倫輻射帶"],ans:3,why:["高原仍在大氣層底下，X 光到不了。","沒有光害只對可見光有幫助。","大氣穩定只改善可見光的影像，X 光一樣被吸收。","X 光必須在大氣層外觀測；輻射帶裡的高能帶電粒子會干擾儀器，所以要避開。"]},
   {src:"講義 p23 第 27 題（101 學測）改寫・答案已對照講義答案頁",q:"仙女座的 M31 是渦狀星系，獵戶座的 M42 是發射星雲，而且 M42 看起來比 M31 小。兩者與太陽的距離關係何者正確？",opts:["M 編號依距離排序，所以 M42 比較遠","M42 看起來比較小，所以比較遠","一個是星系、一個是星雲，但距離差不多","M31 是銀河系外的星系，所以比銀河系內的 M42 遠"],ans:3,why:["梅西爾編號只是目錄順序，和距離無關。","視覺大小還跟天體本身的大小有關，不能直接判斷遠近。","星系在銀河系之外，距離是數百萬光年；星雲在銀河系內，只有上千光年。","肉眼看得到的星雲都在銀河系內，另一個星系一定遠得多。"]},
   {src:"講義 p18 第 10 題（100 學測）改寫・答案已對照講義答案頁",q:"某望遠鏡曝光 1 分鐘，最暗可拍到 20 等的恆星。感光元件收到的光量與曝光時間成正比，曝光 40 分鐘最暗可拍到幾等？",opts:["16 等","20 等","24 等","28 等"],ans:2,why:["方向反了：星等數字越大越暗，收更多光是看到數字更大的星。","曝光變長，收到的光變多，極限一定會改變。","光量變 40 倍，約等於 2.512 的 4 次方，所以可以多暗 4 等，20＋4＝24。","多暗 8 等需要約 1600 倍的光量，40 倍不夠。"]}
  ]},
 {id:"AST-02",name:"恆星性質與星等",pages:"講義 p2-15",
  note:{core:["星等數字越小越亮。差 1 等亮度差約 2.512 倍，差 5 等剛好差 100 倍。","視星等（m）是從地球看到的亮度，受距離影響。絕對星等（M）是把恆星放到 10 秒差距（32.6 光年）時的亮度，代表真正的發光能力。","比較 m 和 M 就能判斷遠近：m 比 M 大（看起來比較暗），代表比 32.6 光年遠；m 比 M 小，代表比較近。","恆星顏色看表面溫度：藍白色最熱，黃色中等，紅色最冷。","光度與「表面積 × 表面溫度的四次方」成正比。又紅（冷）又亮的星，一定非常巨大，這就是紅超巨星。"],
   trap:["差 2 等不是 2 倍也不是 4 倍，是 2.512²，約 6.3 倍。","計算技巧：先湊 5 的倍數。差 14 等＝差 15 等（100 萬倍）再除以 2.512。","行星不會自己發光，它的顏色來自表面物質，不代表溫度。","公式 M＝m＋5−5log d 的 d 一定要用秒差距，不是光年。"]},
  qs:[
   {src:"講義 p16 第 1 題（96 學測）改寫・答案已對照講義答案頁",q:"滿月約 −12 等，太陽約 −26 等。太陽的亮度大約是滿月的幾倍？",opts:["約 14 萬倍","約 25 萬倍","約 40 萬倍","約 100 萬倍"],ans:2,why:["星等差 14 不能直接當成倍數的數字。","把每 1 等當成 2 倍去折算才會得到這個數字，但 1 等是約 2.512 倍。","差 14 等＝2.512 的 15 次方（100 萬倍）除以 2.512，約 40 萬倍。","100 萬倍是差 15 等，題目只差 14 等。"]},
   {src:"講義 p18 第 12 題（99 學測）改寫（數值已更換）・答案已對照講義答案頁",q:"四顆恆星的（視星等，絕對星等）分別是：甲（5，7）、乙（9，12）、丙（6，8）、丁（4，2）。哪一顆與地球的距離大於 32.6 光年？",opts:["甲","乙","丙","丁"],ans:3,why:["甲的視星等比絕對星等小，看起來比標準距離時亮，所以比 32.6 光年近。","乙的視星等比絕對星等小，比 32.6 光年近。","丙的視星等比絕對星等小，比 32.6 光年近。","丁的視星等（4）比絕對星等（2）大，看起來比放在 32.6 光年時還暗，所以更遠。"]},
   {src:"講義 p23 第 28 題（101 學測）改寫・答案已對照講義答案頁",q:"恆星光度與「表面積」成正比，也與「表面溫度四次方」成正比。織女星絕對星等 0、表面溫度 10,000 K；太陽絕對星等 5、表面溫度 6,000 K。織女星的半徑約為太陽的幾倍？",opts:["約 1.2 倍","約 3.6 倍","約 7.7 倍","約 10 倍"],ans:1,why:["絕對星等差 5 等，光度差 100 倍，半徑不可能只差一點點。","光度比 100＝半徑比的平方 × 溫度比的四次方（約 7.7），半徑比的平方約 13，開根號約 3.6。","7.7 是溫度比的四次方，還沒算到半徑。","10 是只把光度 100 倍開根號，忘了扣掉溫度的影響。"]},
   {src:"講義 p18 第 9 題（100 學測）改寫・答案已對照講義答案頁",q:"天蠍座的心宿二和火星看起來都是紅色。兩者呈現紅色的原因何者正確？",opts:["兩者都是因為表面溫度","心宿二是因為表面溫度，火星是因為表面化學組成","心宿二是因為表面化學組成，火星是因為表面溫度","兩者都是因為表面化學組成"],ans:1,why:["火星是行星，不會自己發光，顏色不是溫度造成的。","心宿二是恆星，顏色反映表面溫度（紅色代表溫度低）；火星反射陽光，紅色來自表面的氧化鐵。","兩個原因放反了。","恆星的顏色由表面溫度決定，不是化學組成。"]}
  ]},
 {id:"AST-03",name:"太陽與太陽系",pages:"講義 p2-15（併入第 3 週）",
  note:{core:["太陽由內到外六層：核心、輻射層、對流層、光球層、色球層、日冕。核心進行核融合，是能量的來源。","溫度不是越外面越低：核心最高，其次是最外層的日冕，光球層（約 6000 K）反而比較低。","太陽風是持續向外流的高能帶電粒子。地球磁場擋住大部分，粒子從兩極附近進入大氣，撞擊氣體而產生極光。","黑子是光球層上溫度較低的區域，數量約 11 年一個週期。","類地行星（水金地火）小而密度大；類木行星（木土天海）大而密度小、衛星多。","行星的白天天空亮不亮，要看有沒有大氣散射陽光。月球和水星幾乎沒有大氣，白天天空也是黑的。"],
   trap:["太陽的能量來自核融合，不是太陽風。","太陽風是帶電粒子，所以會被磁場引導到兩極，不是赤道受影響最大。","古人分不出「誰自己發光」，他們是看到行星在星空背景中會移動，才叫它「行」星。","最鄰近地球、又比地球靠近太陽的行星是金星，不是火星。"]},
  qs:[
   {src:"講義 p17 第 4 題（102 學測）改寫・答案已對照講義答案頁",q:"有些帶電微粒會逃離太陽進入太空，稱為太陽風。下列敘述何者正確？",opts:["太陽風是太陽能量的主要來源","太陽風主要是不帶電的高能粒子","地球赤道正對太陽，受太陽風影響最大","地球南北兩極上空的氣體被太陽風撞擊後，會產生極光"],ans:3,why:["太陽的能量來自核心的核融合。","太陽風是帶電粒子，所以才會受地球磁場影響。","帶電粒子被磁場引導，從兩極附近進入大氣，不是赤道。","粒子沿磁力線進入兩極上空，撞擊大氣氣體使其發光，就是極光。"]},
   {src:"講義 p17 第 6 題（101 學測）改寫・答案已對照講義答案頁",q:"夜空中的光點幾乎都是恆星，只有少數幾顆是行星。古人是用什麼方法分辨出行星的？",opts:["看顏色，行星和恆星顏色不同","因為恆星自己發光，行星不發光","行星都比恆星亮","看它們在天上移動的軌跡"],ans:3,why:["恆星和行星都有各種顏色，無法用顏色區分。","這是現代的定義，古人無法知道誰自己發光。","有些恆星比行星亮，亮度不能當作判斷依據。","恆星彼此的相對位置固定，行星卻會在星空背景中移動。"]},
   {src:"講義 p23 第 26 題（102 學測）改寫・答案已對照講義答案頁",q:"下列關於火星的敘述，何者正確？",opts:["火星和月球一樣是地球的衛星","火星是最鄰近地球、而且比地球靠近太陽的行星","火星繞太陽的週期與地球相同，所以也有四季","火星繞太陽的軌道是橢圓，公轉一圈的時間比地球的一年長"],ans:3,why:["火星是繞太陽運行的行星，不是衛星。","符合這個描述的是金星，火星在地球軌道外側。","火星離太陽比較遠，公轉週期比地球長。","行星軌道都是橢圓；離太陽越遠，公轉一圈越久。"]},
   {src:"講義 p19 第 13 題（100 學測）改寫。答案已對照 100 學測公布答案",q:"太空人在月球的白天看到天空是黑的，地球的白天天空卻是亮的。依同樣的道理，比較水星、地球、火星白天的天空，何者合理？",opts:["水星比火星亮","水星比地球亮","火星比水星亮","三者一樣亮"],ans:2,why:["水星幾乎沒有大氣，天空像月球一樣是黑的。","地球大氣最濃厚，散射最多陽光，天空最亮。","天空的亮度來自大氣散射陽光。火星有稀薄大氣，水星幾乎沒有，所以火星比較亮。","三者大氣差異很大，天空亮度不會相同。"]}
  ]},
 {id:"AST-04",name:"天球運動與曆法",pages:"講義 p16-34",
  note:{core:["地球由西向東自轉，所以天體東升西落。面向北方看，星星繞著天球北極逆時針轉。","地球 24 小時轉 360°，每小時 15°，每 1° 需要 4 分鐘。量星軌弧的圓心角就能算曝光時間。","北極星的仰角等於觀測地的緯度。北極星很靠近天球北極，但不是正好在那一點。","正午太陽的位置：天頂對應觀測地緯度，太陽對應當天直射的緯度，兩者相減就是太陽離天頂的角度。","地球公轉軌道是橢圓：1 月初離太陽最近，公轉最快；7 月初最遠，公轉最慢。","日食一定發生在朔（農曆初一），月食一定發生在望（農曆十五左右）。越西邊的地方，日落越晚。"],
   trap:["看到「夏至」不要直接套日出方位口訣，先看題目問的是方位還是正午高度。","星軌的圓心是天球北極，不是北極星本身。","春分到秋分（經過 7 月）比秋分到春分多了約 7 天，原因是公轉速率不同，和自轉無關。","日食當天是新月，晚上看不到月亮。"]},
  qs:[
   {src:"講義 p17 第 7 題（96 學測）改寫（原題為照片，改以圓心角描述）・答案已對照講義答案頁",q:"面向北方長時間曝光拍星空，照片上每條星軌弧的圓心角約 35°。下列敘述何者正確？",opts:["星星逆時針旋轉，曝光約 2 小時多，圓弧的中心是天球北極","星星順時針旋轉，曝光約 2 小時多，圓弧的中心是北極星","星星逆時針旋轉，曝光約 4 小時多，圓弧的中心是天球北極","星星順時針旋轉，曝光約 4 小時多，圓弧的中心是天球北極"],ans:0,why:["面北看星星逆時針轉；35°×4 分鐘＝140 分鐘，約 2 小時多；圓心是天球北極。","面向北方時是逆時針，而且圓心是天球北極，北極星自己也繞著極小的圈。","4 小時多需要約 60° 以上的圓心角。","方向和曝光時間都不對。"]},
   {src:"講義 p18 第 11 題（100 學測）改寫・答案已對照講義答案頁",q:"從春分往後數到秋分有 186 天，從秋分往後數到隔年春分只有 179 天，相差 7 天。主要原因是什麼？",opts:["7 月時地球公轉速率比較慢","7 月時地球自轉速率比較慢","7 月時地球公轉速率比較快","7 月時地球自轉速率比較快"],ans:0,why:["7 月初地球離太陽最遠，公轉最慢，走完春分到秋分這一段要花比較多天。","這是公轉走多快的問題，和自轉無關。","如果 7 月公轉比較快，這一段應該花比較少天。","自轉速率幾乎固定，而且和這個問題無關。"]},
   {src:"講義 p20 第 17 題（99 學測）改寫（原題為示意圖，改以文字描述）・答案已對照講義答案頁",q:"某地位於北緯 40.7°。夏至當天正午，太陽在天空中的位置何者正確？",opts:["正好在天頂","在天頂偏南 17.2° 的位置","在天頂偏北 17.2° 的位置","在天頂偏南 40.7° 的位置"],ans:1,why:["太陽在天頂只會發生在直射的緯度（夏至是北緯 23.5°）。","夏至太陽直射北緯 23.5°，在觀測地的南方；40.7−23.5＝17.2°。","直射點在觀測地的南邊，所以太陽偏南不是偏北。","偏南 40.7° 是春分或秋分（直射赤道）的情況。"]},
   {src:"講義 p19 第 14 題（99 學測）改寫・答案已對照講義答案頁",q:"某天白天發生了日食。當天的月相是哪一種？",opts:["眉月","弦月","滿月（望）","新月（朔）"],ans:3,why:["眉月時月球不在太陽和地球的連線上。","弦月時月球和太陽夾 90°，不可能遮住太陽。","滿月時月球在地球的另一側，可能發生的是月食。","日食是月球走到太陽和地球中間，這一天就是朔。"]},
   {src:"講義 p21 第 19 題（98 學測）改寫・答案已對照講義答案頁",q:"12 月某天傍晚，一艘船航行在日本海，船上的人看到夕陽下緣剛好碰到海面。同一時刻，在臺灣墾丁海邊的人看到的太陽是什麼樣子？",opts:["整個太陽還在海平面之上","和船上的人看到的高度相同","太陽大約一半沒入海面","太陽已經完全沒入海面"],ans:0,why:["墾丁在日本海的西南方。越西邊日落越晚，而且冬季緯度越低白天越長，所以墾丁的太陽還比較高。","兩地經度和緯度都不同，太陽高度不會相同。","墾丁的日落比較晚，太陽還沒開始沒入海面。","這是比日本海更東邊的地方才會看到的情況。"]}
  ]}
]},
{id:"atm",theme:"t-atm",icon:"⛅",name:"大氣島",sub:"濕度、鋒面與颱風",ready:true,levels:[
 {id:"ATM-01",name:"大氣結構與能量",pages:"講義大氣篇 p1-4",
  note:{core:["大氣由下往上分四層：對流層、平流層、中氣層、增溫層。溫度變化是「降、升、降、升」。","對流層的熱源在地表，所以越高越冷，天氣現象都發生在這一層。平流層有臭氧吸收紫外線，所以越高越熱。","中氣層頂（約 80 公里）是整個大氣最冷的地方。增溫層吸收太陽的紫外線和 X 光，溫度又隨高度上升。","空氣上升時，外界壓力變小，體積膨脹，溫度下降；下沉時相反，被壓縮而增溫。這個過程不必和外界交換熱量。","還沒飽和的空氣每上升 1 公里約降 10℃。飽和之後一邊上升一邊凝結放熱，每公里只降約 5℃。","擋住太空高能帶電粒子的是地球磁場；擋住紫外線的是臭氧層。兩件事不要混在一起。"],
   trap:["增溫層很熱是因為吸收太陽輻射，不是因為「離太陽比較近」。","空氣翻過一座山，溫度是先降後升，山頂最低。","算雲裡的溫度要分兩段：雲底以下用未飽和的遞減率，雲底以上改用飽和的遞減率。","上升是膨脹降溫，不是壓縮；方向弄反，整題就全錯。"]},
  qs:[
   {src:"大氣篇 p19 第 1 題（97 學測）改寫・答案已對照歷屆公布答案",q:"一團空氣沿著山坡上升，過程中和周圍空氣幾乎沒有熱量交換。最可能發生什麼變化？",opts:["體積縮小，溫度上升","體積膨脹，溫度上升","體積縮小，溫度下降","體積膨脹，溫度下降"],ans:3,why:["這是空氣下沉、被壓縮時的情況。","膨脹時要對外做功，消耗自己的能量，溫度會下降而不是上升。","上升時外界壓力變小，體積是膨脹不是縮小。","越高氣壓越低，空氣膨脹並對外做功，溫度隨之下降。"]},
   {src:"大氣篇 p21 第 8 題（98 學測）改寫（原題為圖形選項，改以文字描述）・答案已對照歷屆公布答案",q:"一團空氣從山腳上升，越過山頂後再下降到另一側山腳，過程中和周圍沒有熱量交換。這團空氣的溫度怎麼變化？",opts:["先上升後下降，在山頂最高","從頭到尾持續下降","先下降後上升，在山頂最低","幾乎維持不變"],ans:2,why:["方向相反：上升會降溫，不會增溫。","過了山頂開始下沉，空氣被壓縮會增溫。","上升時膨脹降溫，下降時壓縮增溫，所以山頂溫度最低。","高度改變，氣壓跟著變，溫度一定會變。"]},
   {src:"大氣篇 p20 第 7 題（98 學測）改寫・答案已對照歷屆公布答案",q:"地球大氣最上面的增溫層，溫度隨高度增加而上升。最可能的原因是什麼？",opts:["增溫層最接近太空","增溫層受到太陽風的影響","增溫層的空氣稀薄，分子間隔很大","增溫層吸收了太陽輻射中的紫外線與 X 光"],ans:3,why:["接近太空不會讓空氣變熱，太空本身並不提供熱量。","太陽風是帶電粒子，主要造成極光和磁暴，不是增溫的主因。","空氣稀薄是事實，但它不是溫度升高的原因。","高層的氣體分子吸收能量很強的短波輻射後游離並增溫。"]},
   {src:"大氣篇 p23 第 16 題（100 學測）改寫（選項數值略有調整）・答案已對照歷屆公布答案",q:"未飽和空氣上升時每公里降 10℃，飽和空氣每公里降 5℃。地面氣溫 26℃ 的空氣上升後形成積雲，雲底離地 2000 公尺。離地 3000 公尺高的雲裡，溫度大約幾度？",opts:["−4℃","1℃","6℃","11℃"],ans:1,why:["這是三公里全部用每公里 10℃ 去算，忘了雲裡的空氣已經飽和。","到雲底降了 20℃，剩 6℃；雲底以上再升 1 公里，改用每公里 5℃，所以是 1℃。","6℃ 是雲底的溫度，還要再往上 1 公里。","這是三公里全部用每公里 5℃ 去算，但雲底以下的空氣還沒飽和。"]}
  ]},
 {id:"ATM-02",name:"水氣、雲與濕度",pages:"講義大氣篇 p17-19",
  note:{core:["溫度越高，空氣能容納的水氣越多。相對濕度＝實際水氣量 ÷ 該溫度的飽和水氣量。","未飽和的空氣要變飽和有兩條路：加水氣，或降溫。大自然多半走降溫這條路。","露點溫度：水氣量不變，一直降溫到開始凝結的那個溫度。氣溫一定大於或等於露點。","氣溫和露點差得越小，相對濕度越高；兩者相等時相對濕度是 100%。","露點高低直接代表實際水氣量的多寡。問「誰的水氣多」，就是比誰的露點高。","雲和霧是飄在空中的小水滴；露和霜是附著在物體表面。空氣上升會降溫凝結，下沉會增溫變乾。"],
   trap:["「相對濕度高」不等於「水氣多」。相對濕度看氣溫和露點的差距，水氣量看露點本身。","乾濕球溫度計的兩支溫度差越大，代表空氣越乾。","平流霧是暖空氣碰到冷的水面；蒸氣霧是暖的水碰到冷空氣，方向相反。","背風坡的空氣在下沉，會增溫變乾，不會凝結。"]},
  qs:[
   {src:"大氣篇 p21 第 9 題（99 學測）改寫（原題為飽和曲線圖，改以文字描述）・答案已對照歷屆公布答案",q:"清晨草葉上的「露」，主要是空氣透過下列哪一種途徑達到飽和而形成的？",opts:["溫度固定，水氣不斷增加","溫度升高，同時水氣減少","水氣含量不變，溫度降低","溫度降低，同時水氣大量增加"],ans:2,why:["夜晚的地面附近沒有額外的水氣來源持續加水。","這樣會離飽和越來越遠。","夜間地面輻射冷卻，貼近地面的空氣降溫到露點，水氣就凝結在物體表面。","夜裡水氣量大致不變，關鍵只有降溫。"]},
   {src:"大氣篇 p22 第 12 題（100 學測）改寫（數值已更換）・答案已對照歷屆公布答案",q:"四個城市的（氣溫，露點）分別是：甲（33℃，30℃）、乙（32℃，27℃）、丙（28℃，27℃）、丁（18℃，11℃）。哪一個城市的相對濕度最高？",opts:["甲","乙","丙","丁"],ans:2,why:["甲的氣溫和露點差 3℃，不是最小。","乙差 5℃，離飽和更遠。","丙的氣溫和露點只差 1℃，最接近飽和，相對濕度最高。","丁差了 7℃，是四個城市裡最乾的。"]},
   {src:"大氣篇 p22 第 13 題（100 學測）改寫（數值已更換）・答案已對照歷屆公布答案",q:"承上題的資料：甲（33℃，30℃）、乙（32℃，27℃）、丙（28℃，27℃）、丁（18℃，11℃）。哪一個城市單位體積空氣裡的水氣最多？",opts:["甲","乙","丙","丁"],ans:0,why:["露點代表實際水氣量，甲的露點 30℃ 最高，所以水氣最多。","乙的露點 27℃，比甲低。","丙的相對濕度最高，但露點 27℃ 比甲低，實際水氣量比較少。","丁的露點只有 11℃，水氣最少。"]},
   {src:"大氣篇 p21 第 10 題（99 學測）改寫・答案已對照歷屆公布答案",q:"下列哪一種情況，最不可能發生水氣凝結？",opts:["富含水氣的氣流沿著迎風坡爬升","越過山脈後，在背風坡下沉的氣流","暖空氣沿著冷鋒面上升","強烈的熱對流上升"],ans:1,why:["上升會膨脹降溫，容易凝結成雲。","下沉的空氣被壓縮而增溫，相對濕度下降，不會凝結，還可能形成焚風。","暖空氣被抬升後降溫，會成雲降雨。","熱對流旺盛時空氣快速上升降溫，會形成積雨雲。"]}
  ]},
 {id:"ATM-03",name:"風、氣壓與鋒面",pages:"講義大氣篇 p5-9、18",
  note:{core:["空氣從高壓流向低壓就是風。影響風向的有三個力：氣壓梯度力、科氏力、地表摩擦力。","高空沒有摩擦力，風平行等壓線吹，叫地轉風。在北半球，背對著風站，低壓在左手邊。","近地面多了摩擦力，風會斜斜穿過等壓線，偏向低壓那一側。","高壓中心：空氣下沉、向外流出，天氣晴朗。低壓中心：空氣向內流入、上升，容易陰雨。","冷鋒：冷空氣推著走，移動快，鋒後下雨，雨帶窄但雨勢強。暖鋒：移動慢，鋒前下雨，雨帶寬但雨勢弱。","冷鋒追上暖鋒會形成囚錮鋒。冷暖勢力相當、停著不動的是滯留鋒，梅雨就是滯留鋒造成的。","海風在白天由海吹向陸，午後最強，帶來水氣；陸風在夜晚由陸吹向海，通常比較弱。"],
   trap:["「風平行等壓線」只適用高空，地面風一定偏向低壓。","風向是指風「從哪裡來」。北風是從北邊吹過來，往南吹。","清明前後的雨是冷鋒帶來的春雨；梅雨在五、六月，由滯留鋒造成。","東北季風的雨是綿綿細雨，很少打雷；午後雷陣雨才常伴隨閃電雷聲。"]},
  qs:[
   {src:"大氣篇 p20 第 5 題（98 學測）改寫・答案已對照歷屆公布答案",q:"在高氣壓中心，通常會出現哪一種氣流和天氣？",opts:["上升氣流，晴朗","下降氣流，陰雨","上升氣流，陰雨","下降氣流，晴朗"],ans:3,why:["上升氣流會成雲，不會晴朗。","下沉的空氣增溫變乾，不容易成雲降雨。","這是低氣壓中心的情況。","高壓中心的空氣下沉後向外流出，下沉增溫讓雲不易形成，所以晴朗。"]},
   {src:"大氣篇 p23 第 17 題（100 學測）改寫・答案已對照歷屆公布答案",q:"北半球某地高空的地轉風是北風。如果從地面到高空等壓線的分布型態都一樣，這個地方的地面風最可能是什麼風？",opts:["北風","東風","東北東風","北北西風"],ans:3,why:["地面有摩擦力，風向會和高空不同。","東風和高空的風向差了 90°，偏轉太多。","這是偏向高壓那一側，方向反了。","高空吹北風，背風而立時低壓在左手邊，也就是東邊。地面風因摩擦偏向低壓，變成往南偏東吹，所以是從北北西方來的風。"]},
   {src:"大氣篇 p24 第 19 題（92 學測）改寫（原題為連續天氣圖，改以文字描述）・答案已對照講義答案頁",q:"冬季東亞的溫帶氣旋發展過程中，後方移動較快的冷鋒逐漸追上前方移動較慢的暖鋒。最後形成的是哪一種鋒面？",opts:["暖鋒","冷鋒","滯留鋒","囚錮鋒"],ans:3,why:["暖鋒被追上之後就不再單獨存在。","冷鋒追上暖鋒後，兩者合併成另一種鋒面。","滯留鋒是冷暖氣團勢力相當、鋒面幾乎不動的情況。","冷鋒追上暖鋒，暖空氣被抬離地面，就是囚錮鋒。"]},
   {src:"大氣篇 p24 第 20 題（101 學測）改寫（原題為複選，改為單選）・答案已對照歷屆公布答案",q:"關於臺灣常見的海風與陸風，下列敘述何者正確？",opts:["陸風通常比海風強","陸風通常在傍晚最強","海風吹到的地方，相對濕度通常會增加","海風的風向大致平行等壓線"],ans:2,why:["白天海陸的溫差比夜晚大，所以海風通常比較強。","陸風發生在夜間到清晨；傍晚是海風轉弱的時候。","海風從海面帶來水氣，同時讓氣溫下降，相對濕度會上升。","海陸風範圍小、時間短，科氏力來不及作用，風大致是從高壓直接吹向低壓。"]},
   {src:"大氣篇 p24 第 22 題（102 學測）改寫（原題為複選，改為單選）・答案已對照歷屆公布答案",q:"關於臺灣常見的天氣型態，下列敘述何者正確？",opts:["梅雨是暖鋒通過造成的，所以特別潮濕悶熱","秋天的颱風常引進西南氣流，為東北部山區帶來大量降水","梅雨和颱風是臺灣南部主要的降水來源","東北季風下雨時，常伴隨閃電和雷聲"],ans:2,why:["梅雨是滯留鋒造成的。","秋颱在東北部造成大雨，是颱風環流和東北季風的共伴效應，不是西南氣流。","南部冬季位在東北季風的背風面，乾燥少雨，雨水主要靠梅雨和颱風。","東北季風帶來的是地形雨，雨勢小而持續，很少打雷。"]}
  ]},
 {id:"ATM-04",name:"颱風與天氣系統",pages:"講義大氣篇 p15-16、20-23",
  note:{core:["颱風生成要四個條件：離赤道至少 5 個緯度、海水溫度高於 27℃、高低層風速差異小、低層輻合而高層輻散。能量來自水氣凝結放出的熱。","北半球的颱風逆時針旋轉。站在颱風的不同方位，風向都不一樣：中心的東邊吹南風，西邊吹北風，南邊吹西風，北邊吹東風。","颱風眼：氣壓最低、幾乎無風、有微弱的下沉氣流。眼牆：風最強、雨最大。","強度看中心附近最大風速：17.2 m/s 以上是輕度颱風，32.7 以上是中度，51 以上是強烈颱風。","颱風大致沿著太平洋高壓的邊緣移動。路徑潛勢圖的圈圈是中心可能出現的範圍，和強度無關。","暴潮：中心氣壓低，海面被吸高，再加上向岸的強風把海水推上岸，造成海水倒灌。","焚風：氣流翻過山之後在背風面下沉增溫，又乾又熱。"],
   trap:["「低氣壓造成空氣上升」是倒因為果。是空氣先受熱上升、重量減輕，氣壓才下降。","西北颱只指中心從基隆和彭佳嶼之間通過的那一種路徑。","西南氣流不是西南季風，它是颱風在臺灣附近往北移動時引進來的氣流。","莫拉克颱風的豪雨來自西南氣流；梅姬颱風的豪雨來自和東北季風的共伴效應。兩個常被互換出題。"]},
  qs:[
   {src:"大氣篇 p19 第 3 題（97 學測）改寫（原題為衛星雲圖，改以文字描述）・答案已對照歷屆公布答案",q:"一個颱風在北半球接近臺灣。甲地在颱風眼正西方的暴風圈內，乙地就在颱風眼裡，丙地在颱風眼正東方的暴風圈內。三地的風向分別是什麼？",opts:["甲吹北風，乙幾乎無風，丙吹南風","甲吹南風，乙幾乎無風，丙吹北風","甲吹東風，乙吹西風，丙吹西風","甲吹西風，乙幾乎無風，丙吹東風"],ans:0,why:["北半球颱風逆時針旋轉：中心西側的空氣往南吹，是北風；東側往北吹，是南風；颱風眼內幾乎無風。","這是順時針旋轉，是南半球的情況。","颱風眼裡風很弱，而且中心兩側的風向應該相反。","東風和西風出現在颱風中心的北側和南側，不是東西兩側。"]},
   {src:"大氣篇 p20 第 4 題（97 學測）改寫（原題為圖形選項，改以文字描述）・答案已對照歷屆公布答案",q:"承上題，沿著甲、乙、丙三地的連線量氣壓，變化最接近哪一種？",opts:["三個地方的氣壓相同","乙地最低，往甲、丙兩側升高","乙地最高，往甲、丙兩側降低","從甲地到丙地一路下降"],ans:1,why:["颱風是很強的低氣壓系統，氣壓由外往內快速下降。","颱風眼是氣壓最低的地方，越往外氣壓越高。","這是高氣壓系統的分布。","颱風的氣壓分布大致以中心對稱，不會單向一路下降。"]},
   {src:"大氣篇 p23 第 14 題（100 學測）改寫（原題為示意圖，改以文字描述）・答案已對照歷屆公布答案",q:"一個颱風從臺灣東部往西偏北移動，此刻中心正要從西海岸的中部出海。哪一段海岸最容易發生海水倒灌？",opts:["西北部海岸","西南部海岸","東北部海岸","東南部海岸"],ans:1,why:["中心北側吹東風，風從陸地吹向臺灣海峽，海水不會被推上岸。","中心南側吹西風，風從海面吹向陸地，把海水推上西南部沿海，加上低氣壓使海面升高，最容易倒灌。","這裡離中心比較遠，而且風大致沿著海岸吹。","這裡的風是從山區吹下來的離岸風，不會把海水推上岸。"]},
   {src:"大氣篇 p23 第 15 題（100 學測）改寫（原題為示意圖，改以文字描述）・答案已對照歷屆公布答案",q:"承上題，同一個時刻，哪一個地方最容易出現焚風？",opts:["西南部海岸","西海岸中部","東南部海岸","各地都不容易出現"],ans:2,why:["這裡是西風的迎風面，氣流在上升，會下雨不會有焚風。","這裡在颱風中心附近，沒有翻山下沉的氣流。","中心南側的西風越過中央山脈後，在東南側下沉增溫，形成又乾又熱的焚風。","只要有氣流越過高山後下沉，背風面就可能出現焚風。"]},
   {src:"大氣篇 p22 第 11 題（99 學測）延伸改寫（原題為路徑圖判讀，改考成因）・成因已對照 99 學測官方解析",q:"2009 年莫拉克颱風在臺灣南部降下破紀錄的豪雨，造成八八水災。豪雨最主要的原因是什麼？",opts:["颱風眼牆直接通過南部上空","颱風引進旺盛的西南氣流，水氣受中央山脈抬升","颱風環流和東北季風產生共伴效應","颱風造成的暴潮使海水倒灌"],ans:1,why:["莫拉克的中心從花蓮登陸、往西北移動，並沒有直接通過南部。","颱風往北移動時把南海的大量水氣帶進來，在山區迎風面被抬升，連續降下豪雨。","共伴效應發生在秋冬有東北季風的時候，八月沒有東北季風。","暴潮造成的是沿海淹水，不會帶來山區的超大雨量。"]}
  ]}
]},
{id:"geo",theme:"t-geo",icon:"⛰️",name:"地質島",sub:"震波、板塊與岩層",ready:true,levels:[
 {id:"GEO-01",name:"地球內部與震波",pages:"地質地物篇 p1-2、21-23（筆記為自行整理，老師尚未教）",
  note:{core:["地球內部由外到內分三層：地殼、地函、地核。厚度和密度的順序是地核大於地函大於地殼；體積的順序是地函大於地核大於地殼。","大陸地殼主要是花崗岩質，平均厚約 35 公里，密度較小。海洋地殼主要是玄武岩質，平均厚約 7 公里，密度較大。","岩石圈是地殼加上一小部分上部地函，厚約 100 公里，板塊指的是岩石圈。它下面的軟流圈部分熔融，會緩慢對流。","科學家靠地震波探測內部：P 波先到，S 波後到，兩者到達的時間差越大，離震源越遠。波速突然改變的地方，就是不同層的交界。","地殼均衡：地殼像浮在軟流圈上。普拉特假說說質量相同、密度不同；艾里假說說密度相同、厚度不同，高山底下有深深的山根。","鑽探只能挖到地殼很淺的部分。要取得上部地函的物質，要選地殼最薄的地方。"],
   trap:["板塊不是地殼，是整個岩石圈。","「厚的比較輕」：大陸地殼厚但密度小，海洋地殼薄但密度大。","算震波到達時間要分兩步：先用時間差求出距離，再用 P 波速度算出 P 波走的時間。","鑽探取地函不要選高山或大陸，那裡的地殼最厚。"]},
  qs:[
   {src:"地質篇 p28 第 18 題（96 學測）改寫・答案已對照講義答案頁",q:"想知道岩石圈的底界有多深，下列哪一種技術最好用？",opts:["利用地震波在地球內部傳播速度的急遽變化來判斷","使用聲納，利用聲波反射的原理測量","靠繞極軌道衛星做遙感探測","由陸地向下鑽探直接量測"],ans:0,why:["岩石圈底部是軟流圈，地震波穿過時速度會明顯改變，可以由此找出交界深度。","聲納主要用來測海底地形，沒辦法穿過很深的岩層。","衛星遙感看的是地表和大氣，探測不到地底深處。","鑽探只能鑽到地殼很淺的地方，到不了一百公里深。"]},
   {src:"地質篇 p31 第 27 題（103 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"某地發生地震，P 波速度為 6 公里／秒，S 波為 4 公里／秒。這兩種波到達甲測站的時間差為 10 秒，到達乙測站的時間差為 30 秒。甲測站在上午 9:25:30 測到初達的 P 波，乙測站應在何時測到初達的 P 波？",opts:["9:25:40","9:26:00","9:26:10","9:26:20"],ans:2,why:["這是直接把甲站的時間差 10 秒加上去，時間差只能用來求距離。","這是把乙站的時間差 30 秒直接加上去，同樣是用錯了。","時間差＝距離÷4−距離÷6，求出甲站 120 公里、乙站 360 公里。P 波到甲站要 20 秒，到乙站要 60 秒，乙站比甲站晚 40 秒，所以是 9:26:10。","這是把甲站 P 波的走時誤當成 10 秒，才會多出 10 秒。"]},
   {src:"地質篇 p32 第 28 題（103 學測）延伸改寫・原理已對照 103 學測官方解析",q:"科學家想鑽探取得上部地函的岩石樣本，應選擇哪一類地點最容易成功？",opts:["地殼最厚的高山地區","地殼最薄的海洋地殼處","地勢高的大陸高原","一般的大陸平原"],ans:1,why:["高山底下有深深的山根，地殼最厚，鑽不到地函。","海洋地殼平均只有約 7 公里，是地殼最薄的地方，離地函最近。","高原地勢高，地殼也厚。","大陸地殼平均約 35 公里，仍比海洋地殼厚得多。"]},
   {src:"地質篇 p33 第 33 題（105 學測）改寫（原題為複選，改為單選）・答案已對照歷屆公布答案",q:"關於地殼均衡的敘述，下列何者正確？",opts:["喜馬拉雅山的山根比臺灣中央山脈的山根淺","冰川退卻後，當地的地殼會因為載重減小而逐漸下沉","若質量相同，岩石密度較小的山會比較高","侵蝕作用會使地殼下沉"],ans:2,why:["喜馬拉雅山更高，山根也更深。","冰川退卻後載重減小，地殼會慢慢抬升，不是下沉。","質量相同、密度較小的岩石體積較大，浮得比較高，這是普拉特假說的觀念。","侵蝕帶走山頂的岩石，載重減小，地殼反而會抬升。"]},
   {src:"地質篇 p33 第 35 題（106 學測）改寫（原題為複選，改為單選）・答案已對照歷屆公布答案",q:"關於大陸地殼與海洋地殼的比較，下列何者正確？",opts:["大陸地殼比較厚，密度比較小","海洋地殼主要是矽鋁質的花崗岩","目前發現最老的海洋地殼約有 40 億年","海洋地殼主要是沉積岩"],ans:0,why:["大陸地殼平均約 35 公里，海洋地殼約 7 公里；但大陸地殼密度較小，所以浮得比較高。","海洋地殼主要是鐵鎂質的玄武岩；矽鋁質的花崗岩是大陸地殼的主要岩石。","海洋地殼會在海溝隱沒回地函，最老的只有約 2 億年。","海洋地殼主要是玄武岩，是火成岩。"]}
  ]},
 {id:"GEO-02",name:"板塊、地震與火山",pages:"地質地物篇 p3-11（筆記為自行整理，老師尚未教）",
  note:{core:["板塊交界有三種：張裂性（中洋脊、大裂谷）、聚合性（海溝、造山帶、火山）、錯動性（水平錯開，例如加州聖安德列斯斷層）。","聚合性邊界：一邊海洋、一邊大陸時，海洋板塊隱沒到下方，形成海溝和火山。兩邊都是大陸時，只會造山，不會有火山。","隱沒帶的地震淺源、中源、深源都有，深度可到 700 公里；中洋脊的地震則幾乎都是淺源。","地震規模看釋放的能量，一場地震只有一個規模值。震度是各地搖晃的程度，會隨距離和地質條件而不同。","臺灣是菲律賓海板塊和歐亞板塊聚合推擠形成的，現在仍在抬升。東部和南部外海有海溝。","斷層分類：上盤相對下降是正斷層，上盤相對上升是逆斷層；水平錯開的是平移斷層，站在一側看，對面向右移是右移斷層。"],
   trap:["規模沒有單位，震度才用「級」。同一場地震只有一個規模，卻有很多個震度。","臺灣南方和東方的隱沒方向剛好相反。","錯動性邊界有淺源地震，但幾乎沒有火山。","判斷平移斷層方向，要站在一側看對面往哪邊移，不是看自己這一側。"]},
  qs:[
   {src:"地質篇 p27 第 13 題（101 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"下列關於隱沒帶的敘述，何者正確？",opts:["隱沒帶附近的海洋地殼，比中洋脊附近的年輕","隱沒帶是地殼密度分布最均勻的地方","隱沒帶屬於張裂性板塊邊界","岩石圈被帶到隱沒帶的深處"],ans:3,why:["海洋地殼在中洋脊誕生，離中洋脊越遠越老，所以隱沒帶附近的是最老的。","隱沒帶有板塊下沉、熔融和火山，物質分布很不均勻。","隱沒帶是兩個板塊聚合的地方，屬於聚合性邊界。","岩石圈就是板塊，會在隱沒帶向下隱沒到軟流圈。"]},
   {src:"地質篇 p27 第 11 題（100 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"下列哪一項敘述最能證明臺灣位於聚合型板塊邊界？",opts:["臺灣本島有玄武岩","臺灣本島常有地震","臺灣本島的地層下陷","臺灣東部和南部外海有海溝分布"],ans:3,why:["玄武岩零星分布在北部，不是聚合邊界的特徵。","三種板塊邊界都常有地震，只憑「常有地震」只能說明臺灣在板塊邊界上。","地層下陷大多是超抽地下水造成的，和板塊邊界無關。","海溝是聚合性邊界的典型地形，東部的琉球海溝和南部的馬尼拉海溝就是證據。"]},
   {src:"地質篇 p32 第 29 題（104 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"依板塊構造學說，推測隱沒帶（例如印尼）和中洋脊（例如冰島）的地震類型，下列何者正確？",opts:["隱沒帶和中洋脊都只有淺源和中源地震","隱沒帶只有淺源地震，中洋脊淺源、中源、深源都有","隱沒帶淺源、中源、深源地震都有，中洋脊以淺源地震為主","隱沒帶和中洋脊，從淺源到深源的地震都有"],ans:2,why:["隱沒帶的板塊會往下插到很深的地方，還會有深源地震。","兩者說反了：隱沒帶才有深源地震。","隱沒板塊沿著斜面往下，各種深度的地震都有；中洋脊的岩石圈很薄，震源很少超過 70 公里。","中洋脊的岩石圈很薄，不會有中源、深源地震。"]},
   {src:"地質篇 p27 第 14 題（96 學測）改寫（刪去兩個選項）・答案已對照講義答案頁",q:"某天晚上在恆春外海連續發生三次地震，規模分別是 6.7、6.4、5.2，各縣市遇到的最大震度是 5 級（恆春）、4 級（大武）、3 級（花蓮、臺中）、2 級（臺北、宜蘭）、1 級（竹北）。關於這一晚的地震，釋放的總能量與各地搖晃程度的等級各是多少？",opts:["總能量最大為 6.7，各地搖晃程度最大為 5","總能量最大為 6.7，各地搖晃程度最大為 1","總能量最大為 5.2，各地搖晃程度最大為 5","總能量最大為 5.2，各地搖晃程度最大為 1"],ans:0,why:["規模代表能量，取最大的 6.7；震度代表搖晃程度，最大的是恆春的 5 級。","搖晃程度最大的地方是恆春，不是 1 級。","規模越大，釋放的能量越大，應取最大的 6.7，不是最小的 5.2。","規模和震度兩個數字都取反了。"]},
   {src:"地質篇 p33 第 32 題（105 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"某處有一條南北向的垂直斷層，志明家在斷層東邊，鳳英家在西邊。六年來志明發現鳳英的房子往北移動了二十多公分，沒有高低落差。這是哪一種斷層？",opts:["正斷層","逆斷層","左移斷層","右移斷層"],ans:3,why:["正斷層是上盤向下滑，有高低落差，不是水平移動。","逆斷層是上盤向上推，有高低落差，不是水平移動。","站在志明這一側面向西，對面往北移是向右，不是向左。","志明面對鳳英家時，鳳英家往右（北）移動，所以是右移斷層。"]}
  ]},
 {id:"GEO-03",name:"岩石、地層與構造",pages:"地質地物篇 p14-21（筆記為自行整理，老師尚未教）",
  note:{core:["岩石分三大類：火成岩（岩漿冷卻）、沉積岩（沉積物固結）、變質岩（高溫高壓改變原岩）。判斷的依據是成因。","花崗岩是淺色、晶體大的深成岩，含石英、正長石、雲母。玄武岩是暗色、晶體細小的火山岩，含輝石、橄欖石。沉積岩的特徵是有層理。","變質岩的礦物常排成一定方向，片麻岩就是例子。石灰岩變質成大理岩，砂岩變質成石英岩。","褶皺分背斜和向斜。背斜向上拱起，最老的岩層在中心；向斜向下凹，最年輕的岩層在中心。褶皺是岩層受側向擠壓而彎曲。","正常沒有倒轉的地層，下面老、上面新。如果年輕的岩層反而在下面，就是地層倒轉了。","走向是岩層面和水平面交線的方向，傾角是岩層面和水平面的夾角。岩層往傾斜方向越往下越深。"],
   trap:["背斜、向斜要看岩層年代：背斜中心最老，向斜中心最新。看形狀之前要先確認地層有沒有倒轉。","地質剖面圖上看到的彎曲，反映的是這個剖面方向上的受力。朝北看的剖面，受力是東西向。","岩層沿傾斜方向向下走，往反方向則漸漸露出地面。","同一種原岩變質後會換名字，成分卻可能相近，例如石灰岩變成大理岩。"]},
  qs:[
   {src:"地質篇 p25 第 5 題（98 學測）改寫（原題為岩石圖片，改以文字描述）・答案已對照歷屆公布答案",q:"變質岩中的礦物，因為曾受到較大壓力或溫度影響，有些常排成一定的方向。下列哪一種岩石最可能是變質岩？",opts:["玄武岩（暗色細粒的火山岩）","片麻岩（有條紋狀排列的礦物）","礫岩（含圓形礫石的岩石）","花崗岩（粗粒、礦物雜亂分布）"],ans:1,why:["玄武岩是岩漿冷卻形成的火成岩，礦物不會有明顯排列。","片麻岩的礦物被壓成一條一條，這種排列叫葉理，是典型的變質岩。","礫岩是沉積岩，由礫石固結而成。","花崗岩是岩漿冷卻形成的深成岩，礦物是雜亂分布的。"]},
   {src:"地質篇 p29 第 20 題（102 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"甲、乙、丙三種岩石是花崗岩、玄武岩和砂岩。甲含石英、正長石、斜長石、白雲母、黑雲母，晶體大而明顯；乙含輝石、斜長石、橄欖石、鈦鐵礦、黃鐵礦，晶體小而不明顯；丙有層理。下列對應何者正確？",opts:["甲花崗岩，乙玄武岩，丙砂岩","甲花崗岩，乙砂岩，丙玄武岩","甲玄武岩，乙花崗岩，丙砂岩","甲玄武岩，乙砂岩，丙花崗岩"],ans:0,why:["含石英和雲母、晶體粗大的是花崗岩；含輝石和橄欖石的基性岩、晶體細小的是玄武岩；有層理的是沉積岩，也就是砂岩。","有層理的是丙，所以丙應該是沉積岩，不是火成岩的玄武岩。","石英和白雲母是酸性岩的礦物，應該是花崗岩，而且玄武岩不含石英。","丙有層理，不可能是花崗岩。"]},
   {src:"地質篇 p24 第 1 題（97 學測）改寫（原題為剖面圖，改以文字描述）・答案已對照歷屆公布答案",q:"某生朝正北方看到一個地層垂直剖面：地層向上拱起，中心的地層最老，往兩側地層漸漸變新。這是什麼構造？最可能受到哪個方向的擠壓？",opts:["向斜構造，受到東西向擠壓","向斜構造，受到南北向擠壓","背斜構造，受到東西向擠壓","背斜構造，受到南北向擠壓"],ans:2,why:["向斜是向下凹、中心最新；這裡是向上拱、中心最老。","構造判斷錯了，而且受力方向也不對。","向上拱起、中心最老是背斜。朝北看到的剖面是東西向，彎曲的方向反映的是東西向的擠壓。","構造判斷正確，但朝北看的剖面是東西向，彎曲反映的是東西向擠壓，不是南北向。"]},
   {src:"地質篇 p30 第 24 題（102 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"南北向剖面上有一個褶皺構造，地層向上拱起，由外往內地層編號是 1 到 5，號碼越大越年輕，也就是最年輕的第 5 層在最下面（最裡面）。關於這個褶皺的敘述，何者正確？",opts:["地層沒倒轉，褶皺是背斜","地層已倒轉，褶皺是背斜","地層沒倒轉，褶皺是向斜","地層已倒轉，褶皺是向斜"],ans:3,why:["沒倒轉的地層下面老、上面新，這裡最年輕的反而在最下面，不可能沒倒轉。","地層倒轉是對的，但把構造看成背斜就錯了。","圖上最年輕的地層在最下面，所以地層一定有倒轉過。","如果把地層翻正，最年輕的第 5 層會在最上面（中心），這是向斜構造。"]},
   {src:"地質篇 p32 第 30 題（104 學測）改寫（原題為平面圖，改以文字描述；刪去一個選項）・答案已對照歷屆公布答案",q:"一片平坦的地面，從西到東依序露出頁岩層、煤層、砂岩層，走向都是南北向，往東傾斜 30 度。甲、乙在頁岩層上（甲更西，乙緊鄰煤層），丙、丁在砂岩層上（丙緊鄰煤層，丁更東）。在哪裡鑽井，可以在最淺處鑽到煤層？",opts:["甲","乙","丙","丁"],ans:2,why:["甲在頁岩層上，煤層在頁岩的上方，往下鑽不會遇到。","乙也在頁岩層上，同樣鑽不到煤層。","岩層往東傾斜，往東越深。砂岩在煤層上方，丙緊鄰煤層，往下鑽最先遇到。","丁雖然也鑽得到，但離煤層露頭更遠，煤層埋得更深。"]}
  ]},
 {id:"GEO-04",name:"地質年代與定年",pages:"地質地物篇 p12-13（筆記為自行整理，老師尚未教）",
  note:{core:["判斷地質事件先後有三個定律：疊置定律（下面老、上面新）、水平沉積定律（沉積岩層原本是水平的）、截切定律（切過去的事件比被切的晚）。","岩脈或斷層切過岩層，岩脈和斷層就比岩層晚形成，要用截切定律，不是疊置定律。","絕對年代用放射性元素的半衰期來推算。經過一個半衰期，剩下一半；經過兩個半衰期，剩下四分之一。","相對年代用地質年代表。標準化石生存時間短、分布廣，可以指出年代；指相化石指出生物生活的環境。","均變說的意思是：過去發生地質作用的原理，和現在正在進行的作用相同，所以可以用現在推論過去。","從沉積顆粒大小的變化，可以推斷當時的沉積環境：礫最靠陸地，砂次之，泥在最深的海底。"],
   trap:["相對年代不是靠放射性元素，那是絕對年代。","半衰期兩次是剩四分之一，不是二分之一。","岩脈、斷層和岩層誰先誰後，看「誰切過誰」，不是看誰在上面。","從老到新顆粒越來越細，代表水流越來越慢、水越來越深，是海進。"]},
  qs:[
   {src:"地質篇 p38 第 51 題（110 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"下列關於探索地球歷史的敘述，何者正確？",opts:["根據疊置定律，可以推測岩脈的形成時間比圍繞岩脈的地層晚","相對地質年代是根據放射性元素定年，用來分辨岩層的早晚","利用放射性元素定年，母元素經過 2 個半衰期，只剩下原來的二分之一","「均變說」是指過去發生地質作用的原理，和現在進行地質作用的原理相同"],ans:3,why:["岩脈切過地層，要用截切定律，不是疊置定律。","用放射性元素定年得到的是絕對地質年代。","兩個半衰期剩下四分之一，一個半衰期才是二分之一。","均變說就是「現在是了解過去的鑰匙」。"]},
   {src:"地質篇 p38 第 52 題（110 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"某個鑽井由上而下依序鑽出頁岩、砂岩和礫岩，這些岩層都沒有經過變動。下列關於它們生成的敘述，何者正確？",opts:["沉積環境的水愈晚期愈淺","沉積環境的水流速度愈晚期愈慢","火山激烈噴發，火山彈四射後沉積成礫岩","斷層作用使原來的礫岩粉碎成砂岩和頁岩"],ans:1,why:["礫岩最早、頁岩最晚，顆粒越來越細，代表水越來越深，不是越來越淺。","下面的礫岩最早形成、顆粒最粗，水流很快；越晚顆粒越細，水流越慢。","沒有證據顯示和火山噴發有關，礫岩是水流搬運礫石沉積的。","岩層都沒有經過變動，所以不是斷層作用造成的。"]},
   {src:"地質篇 p31 第 26 題（103 學測）改寫（原題為岩層照片，改以文字描述；刪去一個選項）・答案已對照歷屆公布答案",q:"河川攜帶泥砂到海岸，不同顆粒大小會沉積在不同地方。某地的地層由老到新依序是甲（礫）、乙（砂）、丙（泥）。若只考慮海水相對陸地的變動，這裡的沉積環境最可能怎麼變化？",opts:["海退","海進","先海退、後海進","海水面保持不變"],ans:1,why:["海退時海岸線往海洋方向後退，沉積物會越來越粗。","礫靠陸地、砂在淺海、泥在深海。越晚的地層顆粒越細，代表這裡越來越深，是海進。","這樣的順序是先變細、後變粗。","如果海水面不變，沉積物不會出現規律變細。"]},
   {src:"地質篇 p29 第 19 題（102 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"花東海岸的海蝕洞離海平面約 3 公尺高，洞頂附近發現成帶狀的藤壺化石。現生藤壺必須附著在潮間帶生長，而且當地潮差不超過 1 公尺。化石出現在這麼高的位置，最可能與哪一種地質作用有關？",opts:["海嘯","地殼緩慢抬升","隕石撞擊","山崩"],ans:1,why:["海嘯是瞬間的作用，無法讓化石成帶狀整齊排列在固定高度。","藤壺原本生活在潮間帶，現在高出海面 3 公尺，表示地殼相對海平面長期上升。","沒有證據顯示有隕石撞擊，也不會造成這種規律的分布。","山崩是岩石滑落，不會讓海蝕洞整體升高。"]}
  ]}
]},
{id:"ocn",theme:"t-ocn",icon:"🌊",name:"海洋島",sub:"海水分層與洋流",ready:true,levels:[
 {id:"OCN-01",name:"海水性質與分層",pages:"海洋篇 p1-2（老師已教，筆記含課堂內容）",
  note:{core:["海水由上到下分三層：混合層、斜溫層、深水層。混合層受風浪攪拌，溫度、鹽度、密度都差不多；斜溫層溫度隨深度急遽下降；深水層很穩定，溫度最低、密度最大。","低緯度的斜溫層最明顯；中緯度的混合層有冬夏之分；高緯度終年很冷，分層最不明顯。","表層水溫可以猜緯度：低緯度約 25 到 28℃，中緯度夏天 15 到 25℃、冬天 10 到 15℃，高緯度約 0 到 5℃。","鹽度是每 1 公斤海水所含溶質的克數，沒有單位，用千分比表示。三大洋平均約 35‰。","鹽類裡最多的離子是氯離子，約 55%；其次是鈉離子，約 30.6%。不管鹽度多少，各種主要鹽類的比例固定，這叫馬歇爾定律。","開放大洋的鹽度，副熱帶海域最高，不是赤道。副熱帶下沉氣流強、少雨，蒸發量大於降水量。","現代測鹽度是用鹽溫深儀（CTD）量導電度，再換算成鹽度。"],
   trap:["鹽度最高在副熱帶，不在赤道。赤道雖然蒸發量大，但降雨更多。","鹽度沒有單位，不要寫成「35 度」或「35 級」。","影響表面鹽度最重要的兩個因素是降雨量和蒸發量，和雲量、陽光無關。","近河口的海水會被河水稀釋，鹽度比外海低很多。"]},
  qs:[
   {src:"海洋篇 p16 第 6 題（100 學測）改寫（原題為複選，改為單選）・答案已對照歷屆公布答案",q:"下列哪一組是影響表面海水鹽度最重要的兩個因素？",opts:["降雨量與海水蒸發量","雲量與陽光強度","陽光強度與海水表面溫度","雲量與海水表面溫度"],ans:0,why:["降雨會稀釋海水、蒸發會讓鹽分濃縮，這兩個因素決定了表面鹽度的高低。","雲量和陽光只間接影響蒸發，不是最主要的因素。","溫度和陽光也只是間接影響。","雲量和溫度都不是最直接的因素。"]},
   {src:"海洋篇 p16 第 5 題（98 學測）改寫（原題為六張圖，改以文字描述）・答案已對照歷屆公布答案",q:"北半球的海水表面溫度與鹽度，隨緯度由赤道往高緯度變化，下列哪一種描述最合理？",opts:["溫度隨緯度增加而降低，鹽度在副熱帶（約緯度 20 至 30 度）最高","溫度和鹽度都隨緯度增加而升高","溫度隨緯度增加而降低，鹽度在赤道最高","溫度不隨緯度改變，鹽度隨緯度增加而降低"],ans:0,why:["越往高緯度太陽越斜，水溫越低；副熱帶蒸發量大於降水量，鹽度最高。","高緯度的水溫比較低，不是升高。","赤道降雨多，鹽度反而比副熱帶低。","水溫明顯隨緯度改變，這是最基本的分布。"]},
   {src:"海洋篇 p17 第 15 題（102 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"臺灣四季氣溫約在 10 到 35℃ 之間。臺灣四周海域離岸十公里外海的表層海水，下列哪一組溫度 T（℃）和鹽度 S（‰）最可能？",opts:["T＝15，S＝7","T＝25，S＝34","T＝30，S＝3.5","T＝40，S＝10"],ans:1,why:["鹽度只有 7‰，只有河口附近才會被稀釋到這麼低，離岸十公里的外海不會。","外海的鹽度接近三大洋的平均 35‰，水溫 25℃ 也合理。","鹽度 3.5‰ 是把千分比誤當成百分比的結果，海水不會這麼淡。","海水表層溫度不會高到 40℃，鹽度 10‰ 也太低。"]},
   {src:"海洋篇 p19 第 25 題（102 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"研究船現場測量海水鹽度時，使用鹽溫深儀（CTD）。這個儀器是測量海水的哪一項數值，再換算成鹽度？",opts:["導電度","穩定度","濁度","密度"],ans:0,why:["海水含鹽越多，導電度越高，CTD 先量導電度再換算成鹽度；CTD 的 C 就是導電度。","穩定度和鹽度沒有直接換算關係。","濁度是水裡懸浮物的多寡，和鹽度無關。","密度會受溫度、鹽度與深度影響，不是 CTD 直接測的。"]},
   {src:"海洋篇 p21 第 29 題（106 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"太平洋的表面鹽度在副熱帶海域中心有極大值，最主要的原因是什麼？",opts:["此區域有洋流匯合","此區域的蒸發量大於降雨量","大洋邊緣有大量淡水輸入","此區域發生大量垂直混合"],ans:1,why:["洋流匯合不會直接讓鹽度升高。","副熱帶高壓下沉氣流強、少雨，蒸發量大於降水量，鹽分被濃縮。","淡水輸入會讓鹽度降低，不是升高。","垂直混合是讓鹽度趨於均勻，不會形成極大值。"]}
  ]},
 {id:"OCN-02",name:"洋流與海氣交互",pages:"海洋篇 p3-7（老師尚未教，筆記為自行整理）",
  note:{core:["風吹流是風帶動表層海水形成的大洋環流。北半球副熱帶的環流是順時針方向，南半球是逆時針。","在北半球，科氏力讓海水往運動方向的右邊偏，所以大型順時針旋渦的中央水位最高。","補償流（湧升流）：表層海水被風吹走，下面的海水湧上來補充。湧升流的水比較冷，營養鹽比較多，所以常形成好漁場；表面水溫低，暖濕空氣流過來時海面也容易起霧。","密度流（溫鹽環流）：海水因溫度和鹽度改變密度而流動，北大西洋極區是主要下沉處，整個循環約 1000 年。","臺灣附近：黑潮是暖流，沿臺灣東側往北流。冬季有中國沿岸流從北邊帶著冷水南下，夏季有南海海流。","潮汐受月球和太陽引力影響。半日潮是一天兩次漲退，從一次滿潮到下一次滿潮約 12 小時 25 分，其中由乾潮漲到滿潮約 6 小時 12.5 分。","大潮發生在朔和望，潮差最大；小潮發生在上弦和下弦，潮差最小。"],
   trap:["湧升流是冷水上來，不是暖水；表層水溫是下降，營養鹽是增加。","黑潮是往北流的暖流，親潮是從北往南流的寒流。兩個方向相反。","半日潮的週期是 12 小時 25 分（滿潮到下一次滿潮），但「漲潮時間」是由乾潮漲到滿潮，只有一半，約 6 小時 12.5 分。","大潮不是「潮最高的那天」，而是潮差最大，發生在朔望。"]},
  qs:[
   {src:"海洋篇 p16 第 7 題（101 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"北半球海洋中有一個順時鐘旋轉、直徑超過 100 公里的大型旋渦。只考慮科氏力的作用，這個旋渦哪一區域的表面水位最高？",opts:["東、西兩側","外圍","南側","中央"],ans:3,why:["兩側水位沒有特別高。","順時針旋轉時，科氏力讓水往右偏，水往內堆積，外圍反而低。","南側不會特別高。","北半球科氏力往右偏，順時針旋轉的水被推向中央堆積，所以中央水位最高。"]},
   {src:"海洋篇 p16 第 9 題（101 學測）改寫（原題為複選，改為單選）・答案已對照歷屆公布答案",q:"沿岸有湧升流的海域，和相鄰沒有湧升流的海域相比，下列哪一項是它的特色？",opts:["表層海水的溫度下降","表層海水的密度較低","表層海水的營養鹽減少","海面較不容易形成霧"],ans:0,why:["湧升流把下層冷水帶到表面，所以表層水溫下降。","冷水密度比較大，不是較低。","下層水的營養鹽比較多，湧升後表層營養鹽反而增加。","表面水溫比較低，暖濕空氣流過來時容易凝結成霧，所以是比較容易起霧。"]},
   {src:"海洋篇 p20 第 26 題（105 學測）改寫・答案已對照歷屆公布答案",q:"六月某天天氣晴朗幾近無風，海上救難小組接獲通報：有艘漁船八小時前在蘇澳正東方外海五十公里處與親友失聯，可能已失去動力、開始隨海水漂流。救難小組應往失聯處的哪個方向搜尋？",opts:["東方","西方","南方","北方"],ans:3,why:["東方不是黑潮的方向。","西方是陸地和海岸的方向，不會順著洋流漂去。","南方是黑潮的反方向，漁船不會往那邊漂。","蘇澳外海有往北流的黑潮，無風時漁船會隨黑潮往北漂。"]},
   {src:"海洋篇 p18 第 18 題（103 學測）改寫（刪去一個選項）・答案已對照講義答案頁",q:"2011 年日本東北外海發生強震並引發海嘯，福島核電廠的含輻射廢水外洩進入海中。日本東北部外海有親潮自北方沿岸向南流，在約北緯 35 度遇到黑潮。長時間後，表層輻射廢水最可能的漂流去向為何？",opts:["先向南流，之後順著黑潮向西南流到臺灣附近","先向南流，遇到黑潮後轉向東流向中太平洋","先向南流，遇到黑潮後湧升到表層並滯留在日本東南部海域","往北流到北海道海域再轉入日本海"],ans:1,why:["黑潮在這個位置是往東北方向流，不會讓廢水往西南流到臺灣。","親潮把廢水帶向南，遇到北上的黑潮，兩者匯合後一起轉向東，順著北太平洋洋流流向中太平洋。","兩股洋流匯合後會被帶著走，不會停在原地，也不是靠湧升。","親潮是往南流的，廢水不會逆著流到北方。"]},
   {src:"海洋篇 p18 第 20 題（104 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"海洋的潮汐主要受月球影響，配合地球自轉，每天會漲退潮。如果某地潮汐是半日潮（週期 12 小時 25 分），表示每次平均「漲潮時間」（由乾潮漲到滿潮）約為多久？",opts:["24 小時 50 分","24 小時","12 小時 25 分","6 小時 12.5 分"],ans:3,why:["這是全日潮一個週期的長度，不是半日潮的漲潮時間。","月球每天也在繞地球走，潮汐週期不會剛好是整整 24 小時。","12 小時 25 分是半日潮的週期，也就是從一次滿潮到下一次滿潮。","漲潮只是半個週期，由乾潮漲到滿潮，約 12 小時 25 分的一半，也就是 6 小時 12.5 分。"]}
  ]}
]},
{id:"env",theme:"t-env",icon:"🌋",name:"災害島",sub:"天然災害與氣候變遷",ready:true,levels:[
 {id:"ENV-01",name:"天然災害",pages:"天然災害與環境變遷篇 p1-2（老師尚未教，筆記依講義整理）",
  note:{core:["山崩是大規模的岩石或土壤，以不同的凝聚力塊體形態，快速向下坡運動。廣義的山崩包括墜落、地滑和流動。","造成山崩的主要因素有五個：坡度陡峭、坡頂負荷增加、水的影響、岩層破碎、人為開發。","水的影響：水和黏土礦物會產生潤滑作用，孔隙水壓增加還會減少摩擦阻力。豪雨會增加土體重量，同時減少摩擦力。","順向坡是岩層傾斜方向和坡面相同的坡，岩層容易順著滑動；逆向坡比較不容易。坡腳被挖掉，上方岩層就失去支撐。","土石流是土、石頭和水混合後，集體向下流動的流動體。溪流分成上游發生部、中游流動部、下游堆積部。","土壤液化屬於地震災害：地震震動讓土壤顆粒排得更緊密，孔隙水壓增大，顆粒間的結合力變小，土壤變得像泥漿，可能噴沙，或讓建築物因失去承載力而傾斜。"],
   trap:["山崩的定義是岩石或土壤因重力向下坡運動。岩石風化了，還要加上地震、降雨或融雪等觸發因素才會崩。","地下水變少對山坡穩定是好事，豪雨才是增加山崩和土石流的主要條件。","土石流只有含水量夠多才會發生；山崩不一定伴隨土石流。","土壤液化發生在鬆散、含水多的沉積土壤，例如盆地；堅硬岩層不會液化。"]},
  qs:[
   {src:"天然災害篇 p7 第 5 題（101 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"山崩是臺灣常見的天然災害。下列有關山崩的敘述，何者正確？",opts:["山崩就是因重力作用而落下岩石或土壤的現象","只有順向坡的山區才會發生山崩","只有以變質岩為主的山區才會發生山崩","岩石經過風化作用後就一定會發生山崩"],ans:0,why:["山崩的定義就是岩石或土壤因重力而向下坡移動。","順向坡比較容易滑動，但其他坡向在條件具備時也會發生山崩。","任何岩石組成的山區，條件具備都可能發生山崩。","風化後還要有地震、降雨或融雪等觸發因素才會發生。"]},
   {src:"天然災害篇 p9 第 13 題（104 學測）改寫（原題為複選配對，改為單選；第 4 個選項為自編）・答案已對照歷屆公布答案",q:"下列哪一組「條件」與「原因」的配對，可以說明臺灣常有山崩或土石流？",opts:["風化嚴重：岩層破碎，提供土石來源","氣候乾燥炙熱、地下水面下降太多：地下水減少使岩層間摩擦力變小","地層年代太古老：地層間的聯結力變弱","坡度平緩：重力作用變大"],ans:0,why:["風化讓岩層破碎，提供大量土石堆積在坡面，成為山崩和土石流的材料。","地層中的水減少對山坡穩定是好事；而且臺灣山崩多發生在雨季，不是乾燥炙熱的時候。","臺灣的地層一般比較年輕，聯結力和岩層年紀沒有絕對關係，主要看岩石種類。","坡度越陡，重力造成的下滑力越大；坡度平緩反而比較穩定。"]},
   {src:"天然災害篇 p9 第 17 題（106 學測）改寫（原題為複選，改為單選）・答案已對照歷屆公布答案",q:"2009 年八八風災造成臺灣多處山區發生山崩和土石流。下列關於土石流的敘述，何者正確？",opts:["土石流是搬運力很強的內營力","山崩發生時，一定伴隨土石流","土石流的流速每秒可達數公尺，所以流動過程中完全不會有沉積作用","土石流的流速快、具突發性，容易造成嚴重災情"],ans:3,why:["地震才是內營力；降雨、侵蝕、風化是外營力，土石流屬於外營力造成的現象。","山崩時含水量不夠多，就不會形成土石流。","土石流從發生部、流動部到堆積部，流動過程中仍然有沉積作用。","土石流來得快又突然，往往來不及逃，災情容易很嚴重。"]},
   {src:"地質篇 p26 第 10 題（99 學測）改寫（原題為複選，改為單選）・答案已對照歷屆公布答案",q:"臺北盆地主要由鬆散的沉積物組成，盆地西緣有一條山腳斷層，而且是正斷層。若未來山腳斷層活動，在臺北盆地淺部發生芮氏規模 7 的大地震，下列哪一種災害最可能伴隨發生？",opts:["臺北盆地部分地區的建築物因土壤液化而傾倒","山腳斷層西側下陷，造成海水倒灌","臺北盆地因地層抬升使建築物傾倒","臺灣海峽產生海嘯，淡水漁人碼頭和臺北盆地被摧毀"],ans:0,why:["盆地是鬆散、含水多的沉積物，強烈震動會使土壤顆粒排緊、孔隙水壓上升而液化，建築物失去承載力就會傾倒。","正斷層活動時下陷的是上盤，也就是山腳斷層東側的低窪地區，不是西側。","正斷層引起的是地層下陷，不是抬升。","這是陸地上的淺層地震，不會在臺灣海峽產生海嘯。"]}
  ]},
 {id:"ENV-02",name:"氣候與環境變遷",pages:"天然災害與環境變遷篇 p3-5（老師尚未教，筆記依講義整理）",
  note:{core:["全球暖化的主因是二氧化碳增加，主要來自燃燒石油、煤炭、天然氣等化石能源。要減緩暖化，最重要的是管制化石能源的使用。","暖化的影響：極區冰層和高山冰川融化、海平面上升；高山生物棲地消失；颱風強度和頻率可能增加；旱澇發生頻率增加。","溫室氣體包括水氣、二氧化碳、甲烷、一氧化二氮、臭氧等。氮氣和氧氣雖然佔大氣的 99%，卻不是溫室氣體。","臭氧洞：人造的氟氯碳化物在平流層被紫外線分解，放出氯，破壞臭氧。南極春季（9 到 10 月）上空臭氧濃度明顯下降。臭氧層能吸收紫外線，保護地球生物。","聖嬰現象：信風減弱，西太平洋的暖水往東擴張，變成西高東低的氣壓場；東太平洋的湧升流減弱，海水變暖，秘魯外海漁場衰退，西太平洋反而偏乾。反聖嬰則相反。","米蘭科維奇理論：軌道離心率（約 10 萬年）、地軸傾角（約 4 萬 1 千年，在 22.5 到 24.5 度之間）、地軸指向的進動（約 2 萬 6 千年）三種變化，會改變各地接受的太陽輻射，造成冰期與間冰期。","冰期時大量的水變成冰，海平面下降，臺灣海峽曾經露出陸地，大陸的動物可以走過來。"],
   trap:["聖嬰是「西高東低」的氣壓，不是東高西低；東太平洋氣壓減西太平洋氣壓為負值才是聖嬰年。","氮氣和氧氣不是溫室氣體，水蒸氣才是。","「臭氧洞」不是真的有洞，只是臭氧濃度變低。臭氧層是吸收紫外線，不是造成暖化。","進動改變的是「近日點出現在哪個季節」，地軸傾角（23.5 度）本身沒變，不要把兩件事混在一起。"]},
  qs:[
   {src:"天然災害篇 p6 第 3 題（98 學測）改寫・答案已對照歷屆公布答案",q:"過去數萬年中，地球曾經處於冰河期，全球的海陸分布和現在不同。關於冰河期時臺灣海峽與歐亞大陸沿岸，下列敘述何者正確？",opts:["由於全球大都覆蓋在冰河下，臺灣海峽海平面上升，臺灣沿海的珊瑚生長帶升高","由於極區冰層擴大，臺灣海峽海平面上升，臺灣沿海的珊瑚生長帶升高","由於全球大都覆蓋在冰河下，臺灣海峽海平面下降，歐亞大陸的大型哺乳類動物可能越過現今的臺灣海峽來到臺灣","由於極區冰層擴大，臺灣海峽海平面下降，歐亞大陸的大型哺乳類動物（如犀牛）可能越過現今的臺灣海峽來到臺灣"],ans:3,why:["全球並沒有大都覆蓋在冰河下，而且冰河期海平面是下降，不是上升。","冰層擴大，水被封存在冰裡，海平面下降，不是上升。","海平面下降是對的，但冰河只覆蓋極區和高緯度地區，「全球大都覆蓋」不符事實。","約兩萬年前冰層最廣，水被封存在冰雪中，海平面比現在低約 120 公尺，臺灣海峽露出陸地，大陸動物可以走到臺灣。"]},
   {src:"天然災害篇 p8 第 9 題（102 學測）改寫（刪去一個選項）・答案已對照歷屆公布答案",q:"聖嬰現象是一種大氣與海洋的交互作用現象。假設 2022、2024、2026、2028 各年 12 月，赤道東太平洋和西太平洋的海平面氣壓異常值（百帕）分別為：2022 年（東 +2、西 0）、2024 年（東 −2、西 −2）、2026 年（東 +1、西 −1）、2028 年（東 −2、西 +2）。哪一年最可能發生聖嬰現象？",opts:["2024 年","2026 年","2028 年","2022 年及 2026 年"],ans:2,why:["東西兩側氣壓同樣是 −2，沒有「西高東低」的差異。","東邊高、西邊低，是正常年或反聖嬰的型態，不是聖嬰。","聖嬰時氣壓是西高東低，東太平洋氣壓減西太平洋氣壓為負值。2028 年東 −2、西 +2，差是 −4，最符合。","這兩年都是東邊氣壓比西邊高，是正常年或反聖嬰的型態。"]},
   {src:"天然災害篇 p8 第 11 題（103 學測）改寫（原題為示意圖，改以文字描述；刪去一個選項）・103 學測官方答案未取得，答案依講義 p5 米蘭科維奇理論判斷",q:"目前地球自轉軸指向北極星，夏至時地球在遠日點。如果地軸的指向轉到相反的方向（進動約一半週期後），但傾角仍是 23.5 度，只從天文角度來看，北半球的夏天與冬天和現在相比如何？",opts:["夏天、冬天都和現在差不多","夏天比現在冷，冬天比現在熱","夏天比現在熱，冬天比現在熱","夏天比現在熱，冬天比現在冷"],ans:3,why:["地軸指向改變後，夏至和冬至在軌道上的位置互換，不會沒有差別。","方向反了：夏至會來到近日點，夏天變熱，冬天變冷。","夏至移到近日點，夏天變熱；冬至移到遠日點，冬天反而變冷，不會兩季都熱。","指向反轉後，夏至在近日點，接收的太陽輻射較多，夏天更熱；冬至在遠日點，冬天更冷，季節差異變大。"]},
   {src:"天然災害篇 p9 第 14 題（104 學測）改寫（原題為複選，改為單選）・答案已對照歷屆公布答案",q:"大氣中的某些氣體會吸收紅外線，因而產生溫室效應，稱為溫室氣體。下列哪一種不是溫室氣體？",opts:["水蒸氣（H₂O）","甲烷（CH₄）","二氧化碳（CO₂）","氮氣（N₂）"],ans:3,why:["水蒸氣會吸收紅外線，是常見的溫室氣體。","甲烷吸收紅外線的能力比二氧化碳強很多，是重要的溫室氣體。","二氧化碳是人類活動增加最多的溫室氣體。","氮氣和氧氣雖然佔大氣的絕大部分，但溫室效應指數是 0，不是溫室氣體。"]},

}
function reviewFail(id){

/* ---- 貓的畫法：以腳底中心為原點，約 50×56 的向量小貓 ---- */

  if(c.pat==="calico") s+=`<path d="M-13,-30 Q-9,-42 0,-41 Q-3,-33 -8,-27 Z" fill="#e9963f"/><path d="M13,-30 Q9,-42 1,-41 Q4,-34 9,-28 Z" fill="${d}"/>`;
  if(c.pat==="van") s+=`<path d="M-8,-38 Q0,-44 8,-38 Q4,-33 0,-34 Q-4,-33 -8,-38 Z" fill="${d}"/>`;

  s+=`<circle cx="-5" cy="-29" r="2.5" fill="${e}"/><circle cx="5" cy="-29" r="2.5" fill="${e}"/><circle cx="-4.3" cy="-29.8" r=".8" fill="#fff"/><circle cx="5.7" cy="-29.8" r=".8" fill="#fff"/>`;

function hexPts(cx,cy,dy){const r=46,v=21.9;return [[cx-r,cy],[cx-r/2,cy-v],[cx+r/2,cy-v],[cx+r,cy],[cx+r/2,cy+v],[cx-r/2,cy+v]].map(p=>p[0]+","+(p[1]+(dy||0))).join(" ")}
function sceneSVG(target){

    return `<path d="${d}" fill="none" stroke="#fffaf5" stroke-width="6" opacity=".55" stroke-linecap="round"/><path class="flow" d="${d}" fill="none" stroke="${L.color}" stroke-width="2.8" stroke-dasharray="7 6" stroke-linecap="round"/>`}).join("")).join("");
  const names=ISLANDS.map(is=>{const ps=is.levels.map(l=>TILE_POS[l.id]);const x=ps.reduce((a,p)=>a+p[0],0)/ps.length,y=Math.max(...ps.map(p=>p[1]))+ (is.levels.length>2?82:80);
    return `<text x="${x}" y="${y}" text-anchor="middle" font-size="13" font-weight="900" letter-spacing="4" fill="#fff" opacity=".92">${is.icon} ${esc(is.name)}${is.ready?"":"・建造中"}</text>`}).join("");
  return `<svg class="scene" viewBox="0 -42 800 542" xmlns="http://www.w3.org/2000/svg" aria-label="地科群島地圖">
    <defs><linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc3cc"/><stop offset="1" stop-color="#4f9fb0"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0dc"/><stop offset="1" stop-color="#c9d6ad"/></linearGradient></defs>
    <rect y="-42" width="800" height="542" fill="url(#sky)"/>
    <path d="M0,70 Q90,20 190,62 T400,48 T610,58 T800,40 V-42 H0 Z" fill="#dfe6c6"/>
    <path d="M20,150 Q60,70 240,78 Q420,40 600,70 Q790,80 785,240 Q800,400 640,440 Q420,480 200,455 Q10,440 15,280 Z" fill="url(#lake)"/>
    <path d="M20,150 Q60,70 240,78 Q420,40 600,70 Q790,80 785,240" fill="none" stroke="#f3ead2" stroke-width="5" opacity=".7"/>
    <path d="M0,500 V400 Q70,410 150,470 L190,500 Z M800,500 V410 Q720,430 660,470 L610,500 Z" fill="#b9c99a"/>
    ${[[40,440],[70,462],[105,480],[760,455],[730,476],[690,488]].map(p=>`<path d="M${p[0]},${p[1]} l-9,20 h18 Z" fill="#7f9f6a"/><rect x="${p[0]-1.5}" y="${p[1]+20}" width="3" height="5" fill="#7a5a3a"/>`).join("")}
    ${[[110,52,34],[330,30,26],[560,40,38],[730,96,24]].map(p=>`<g opacity=".9"><ellipse cx="${p[0]}" cy="${p[1]}" rx="${p[2]}" ry="${p[2]*.36}" fill="#fff"/><ellipse cx="${p[0]+p[2]*.5}" cy="${p[1]+5}" rx="${p[2]*.7}" ry="${p[2]*.28}" fill="#fff"/></g>`).join("")}
    ${[[410,250],[250,300],[560,270],[380,440]].map((p,i)=>`<g class="boat" style="animation-delay:-${i*2.3}s"><path d="M${p[0]-9},${p[1]} h18 l-4,5 h-10 Z" fill="#fffaf5"/><path d="M${p[0]},${p[1]-1} v-12 l8,10 Z" fill="#e0673a"/></g>`).join("")}
    ${[[70,250],[440,110],[720,270],[300,430],[540,430]].map(p=>`<path d="M${p[0]},${p[1]} q6,-4 12,0 t12,0" fill="none" stroke="#fff" stroke-width="1.6" opacity=".5"/>`).join("")}
    ${names}<g class="links">${links}</g>${tiles.map(t=>t[1]).join("")}${labels.join("")}
  </svg>`;
}
function viewMap(){
  window.scrollTo(0,0);app.className="wrap wide";
  const lv=allLevels();
  const nPass=lv.filter(l=>passed(l.id)).length,nDue=lv.filter(l=>isDue(l.id)).length,nMaster=lv.filter(l=>mastered(l.id)).length;
  const nIsle=ISLANDS.filter(i=>i.levels.every(l=>passed(l.id))).length;
  const target=nextTarget();
  app.innerHTML="";
  if(debugDate) app.append($(`<div class="banner debug">測試模式：把今天當成 ${esc(debugDate)}。正式使用請拿掉網址後面的 ?today=</div>`));
  const world=$(`<div class="world"><div class="scene-box"><div class="scene-scroll">${sceneSVG(target)}</div>
    <div class="legend"><b>跨島連線</b>${LINKS.map(L=>`<span title="${esc(L.hint)}"><i style="background:${L.color}"></i>${esc(L.name)}</span>`).join("")}<button class="lgbtn" id="lg" aria-pressed="true">隱藏連線</button></div>
    <div class="scene-brand"><i>GEO ISLANDS</i><b>地科群島</b></div><div class="scene-hint">點一塊島，貓島民會為喵皇講解</div></div>
    <aside class="side"><div class="eyebrow">THE GEO INDEX</div><h1>喵皇出巡，一島一島拿下。</h1><p class="lead">5 座島／16 關。每關由一位貓島民講解，答對情境題就收服那一關。</p>
    <button class="me ${nDue?"due":""}" id="me"><span>${catIcon(EMPEROR,54)}</span><span><b>喵皇</b><small>${nDue?`⏰ 今天有 ${nDue} 關該複習，先去「${esc(target.name)}」`:(passed(target.id)?"目前開放的關卡都拿下了":`下一站：${esc(target.name)}`)}</small></span></button>
    <div class="mini"><div><b>${nPass}/${lv.length}</b><span>已收服</span></div><div><b>${nIsle}/5</b><span>整島制霸</span></div><div><b>${nDue}</b><span>今日複習</span></div><div><b>${nMaster}</b><span>已精通</span></div></div>
    <div id="list"></div>
    <p class="foot" style="text-align:left;margin-top:14px">進度只存在這台裝置的瀏覽器裡，換裝置前請先按右上角「進度備份」。題目依講義所附歷屆學測試題改寫，原題請對照講義頁碼。</p></aside></div>`);
  const list=world.querySelector("#list");
  ISLANDS.forEach(is=>{
    const done=is.levels.filter(l=>passed(l.id)).length;
    list.append($(`<div class="grp"><span>${is.icon} ${esc(is.name)}${done===is.levels.length?" 👑":""}</span><span>${is.ready?done+"/"+is.levels.length:"建造中"}</span></div>`));
    is.levels.forEach(l=>{
      const k=lv.indexOf(l)+1,c=catOf(l.id),[txt,cls,short]=statusText(l.id);
      const b=$(`<button class="item" ${is.ready?"":"disabled"}><span class="no">${String(k).padStart(2,"0")}</span><span class="nm">${esc(l.name)}<small>${esc(c.breed)}（${esc(c.title)}）${is.ready?"・"+esc(txt):""}</small></span><span class="st ${cls}">${is.ready?esc(short):"🔒"}</span></button>`);
      if(is.ready) b.onclick=()=>openLevel(l.id);
      list.append(b);
    });
  });
  world.querySelectorAll(".tile:not(.locked)").forEach(t=>{
    const go=()=>openLevel(t.dataset.id);
    t.addEventListener("click",go);
    t.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}});
  });
  world.querySelector("#lg").onclick=(e)=>{const g=world.querySelector(".links"),off=g.style.display!=="none";g.style.display=off?"none":"";e.target.textContent=off?"顯示連線":"隱藏連線";e.target.setAttribute("aria-pressed",String(!off))};
  world.querySelector("#me").onclick=()=>openLevel(target.id);
  app.append(world);
  const sc=world.querySelector(".scene-scroll");
  if(sc.scrollWidth>sc.clientWidth){const x=TILE_POS[target.id][0]/800*sc.scrollWidth;sc.scrollLeft=Math.max(0,x-sc.clientWidth/2)}
}
function viewIsland(){goHome()}
function setTheme(is){
  const map={"t-ast":["#5a3d9a","#f0ecfa"],"t-atm":["#1f7fc4","#e8f4fd"],"t-geo":["#8a5524","#f8efe3"],"t-ocn":["#087f8f","#e3f6f5"],"t-env":["#b6421f","#fdeee4"]};
  const [a,s]=is?map[is.theme]:["#e0673a","#fff3ea"];
  document.documentElement.style.setProperty("--accent",a);
  document.documentElement.style.setProperty("--soft",s);
  if(is) app.className="wrap";
}
function goHome(){setTheme(null);viewMap()}

/* ---- 畫面：白話筆記 ---- */
function viewNote(id){
  window.scrollTo(0,0);
  const [is,l]=findLevel(id);setTheme(is);
  const s=state[id];
  app.innerHTML="";
  app.append($(`<div class="hero ${is.theme}"><h2>${esc(l.name)}</h2><p>${esc(l.id)}・${esc(l.pages)}・白話筆記</p></div>`));
  app.append(speak(id,`喵～參見喵皇陛下。我是${catOf(id).breed}，在島上擔任${catOf(id).title}。「${l.name}」這一關由我來講解。聽完筆記，再接受我的考驗。`));
  const c=$(`<div class="card"><h3>📖 先看懂這幾件事</h3><ul>${l.note.core.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <h4>⚠️ 常見陷阱</h4>${l.note.trap.map(x=>`<div class="trap">${esc(x)}</div>`).join("")}</div>`);
  app.append(c);
  if(passed(id)){
    app.append($(`<div class="card"><h3>📅 這一關的複習紀錄</h3><table class="sched">
      <tr><th>首次通過</th><td>${esc(s.firstPass)}</td></tr><tr><th>週期基準日</th><td>${esc(s.base)}</td></tr>
      <tr><th>已通過複習</th><td>${s.stage} / 5 次</td></tr><tr><th>下次到期</th><td>${s.due?esc(s.due):"不再排程（已長期記住）"}</td></tr>
      <tr><th>首次挑戰重做</th><td>${s.retries||0} 次</td></tr><tr><th>最近結果</th><td>${esc(s.last||"")}</td></tr></table></div>`));
  }
  const row=$(`<div class="row"><button class="btn" id="go">${passed(id)?"再練一次（不影響複習排程）":"看完了，開始闖關 →"}</button><button class="btn ghost" id="back">← 回群島地圖</button></div>`);
  app.append(row);
  row.querySelector("#go").onclick=()=>viewQuiz(id,"first");
  row.querySelector("#back").onclick=()=>viewIsland(is.id);
}

/* ---- 畫面：作答（mode: first 首次闖關或練習／review 複習） ---- */
function viewQuiz(id,mode){
  const [is,l]=findLevel(id);setTheme(is);
  const pool=shuffle(l.qs);
  const qs=mode==="review"?pool.slice(0,Math.min(2,pool.length)):pool;
  const marks=[];let k=0;
  function draw(){
    window.scrollTo(0,0);
    const q=qs[k];
    const order=shuffle(q.opts.map((_,i)=>i));
    app.innerHTML="";
    app.append($(`<div class="hero ${is.theme}"><h2>${esc(l.name)}</h2><p>${mode==="review"?"閉卷複習：先在心裡回想重點，再作答":"情境題"}・第 ${k+1} / ${qs.length} 題</p></div>`));
    const card=$(`<div class="card"><div class="steps">${qs.map((_,i)=>`<i class="${i<k?(marks[i]?"ok":"no"):(i===k?"on":"")}"></i>`).join("")}</div>
      <div class="src">${esc(q.src)}</div><div class="q">${esc(q.q)}</div><div id="opts"></div><div class="row" id="nextRow" hidden><button class="btn" id="next">${k+1<qs.length?"下一題 →":"看結果 →"}</button></div></div>`);
    const box=card.querySelector("#opts");
    order.forEach((oi,pos)=>{
      const b=$(`<button class="opt">（${"ABCD"[pos]}）${esc(q.opts[oi])}</button>`);
      b.dataset.i=oi;
      b.onclick=()=>{
        const ok=oi===q.ans;marks[k]=ok;
        box.querySelectorAll(".opt").forEach(o=>{
          const i=Number(o.dataset.i);o.disabled=true;
          if(i===q.ans)o.classList.add("right");else if(o===b)o.classList.add("wrong");
          o.after($(`<div class="why ${i===q.ans?"right":""}">${i===q.ans?"✓ 正確：":"✗ "}${esc(q.why[i])}</div>`));
        });
        card.querySelector("#nextRow").before(speak(id,ok?"答對了，陛下英明！":"陛下別急，看看綠色那一項的說明。"));
        card.querySelector("#nextRow").hidden=false;
        card.querySelector("#next").focus();
      };
      box.append(b);
    });
    card.querySelector("#next").onclick=()=>{k++;k<qs.length?draw():finish()};
    app.append(card);
  }
  function finish(){
    const right=marks.filter(Boolean).length;
    mode==="review"?reviewResult(id,right,qs.length):firstResult(id,right,qs.length);
  }
  draw();
}
function firstResult(id,right,n){
  window.scrollTo(0,0);
  const [is,l]=findLevel(id);
  const ok=right>=need(n);const was=passed(id);
  if(!was){
    if(ok) passFirst(id);
    else{const s=state[id]||{retries:0};s.retries=(s.retries||0)+1;state[id]=s;save(state)}
  }
  const islandDone=is.levels.every(x=>passed(x.id));
  app.innerHTML="";
  const c=$(`<div class="card result">${ok?`<div class="badge">${catIcon(catOf(id),92)}</div><h3>${was?"練習完成":"過關！拿到「"+esc(l.name)+"」徽章"}</h3>`:`<div class="big">💪</div><h3>差一點，再試一次</h3>`}
    <p>答對 ${right} / ${n} 題（過關門檻 ${need(n)} 題）</p>
    ${ok&&!was?`<p>下次複習日：<b>${esc(state[id].due)}</b>，到時候這一關會閃爍提醒。</p>`:""}
    ${ok&&!was&&islandDone?`<p>👑 ${esc(is.name)}全部通過，島徽章到手！</p>`:""}
    ${!ok?`<p>題目順序會重新洗牌。可以先回去再看一次筆記。</p>`:""}
    <div class="row" style="justify-content:center">${ok?"":`<button class="btn" id="retry">重新挑戰</button><button class="btn ghost" id="note">回去看筆記</button>`}<button class="btn ${ok?"":"ghost"}" id="back">回群島地圖</button></div></div>`);
  c.prepend(speak(id,ok?(was?"陛下複習得真勤，佩服佩服。":"臣服了！這一關從今天起歸喵皇陛下所有。"):"陛下，這次差一點。再聽我講一次筆記吧。"));
  app.append(c);
  c.querySelector("#back").onclick=()=>viewIsland(is.id);
  if(!ok){c.querySelector("#retry").onclick=()=>viewQuiz(id,"first");c.querySelector("#note").onclick=()=>viewNote(id)}
}

/* ---- 畫面：複習 ---- */
function viewReview(id){
  window.scrollTo(0,0);
  const [is,l]=findLevel(id);setTheme(is);const s=state[id];
  app.innerHTML="";
  app.append($(`<div class="hero ${is.theme}"><h2>⏰ 複習：${esc(l.name)}</h2><p>第 ${s.stage+1} 次複習・不要先看筆記</p></div>`));
  const c=$(`<div class="card"><h3>先閉卷回想 30 秒</h3><p>在心裡講一次這一關的重點和最容易錯的地方，然後回答 2 題。全部答對而且你覺得自己記得，才算通過。</p>
    <div class="row"><button class="btn" id="go">我回想好了，開始 →</button><button class="btn ghost" id="back">← 回群島地圖</button></div></div>`);
  c.prepend(speak(id,"陛下，又見面了。先別翻筆記，閉上眼睛回想我教過的重點。"));
  app.append(c);
  c.querySelector("#go").onclick=()=>viewQuiz(id,"review");
  c.querySelector("#back").onclick=()=>viewIsland(is.id);
}
function reviewResult(id,right,n){
  window.scrollTo(0,0);
  const [is,l]=findLevel(id);
  app.innerHTML="";
  if(right<n){
    reviewFail(id);showOutcome(false,`答對 ${right} / ${n} 題。`);
    return;
  }
  const c=$(`<div class="card result"><div class="big">🤔</div><h3>題目全對。老實說，剛剛回想時你記得重點嗎？</h3>
    <div class="row" style="justify-content:center"><button class="btn" id="yes">記得</button><button class="btn bad" id="no">其實不太記得</button></div></div>`);
  app.append(c);
  c.querySelector("#yes").onclick=()=>{reviewPass(id);showOutcome(true,"")};
  c.querySelector("#no").onclick=()=>{reviewFail(id);showOutcome(false,"你選了「不太記得」。")};
  function showOutcome(ok,msg){
    const s=state[id];app.innerHTML="";
    const o=$(`<div class="card result">${ok?`<div class="badge">${catIcon(catOf(id),92)}</div><h3>複習通過</h3><p>${s.due?`已通過 ${s.stage} / 5 次複習，下次複習日：<b>${esc(s.due)}</b>`:"五次複習全部完成，這一關已經長期記住了 🎉"}</p>`
      :`<div class="big">📖</div><h3>沒關係，退一階重新累積</h3><p>${esc(msg)}複習階段退回 ${s.stage}，下次複習日：<b>${esc(s.due)}</b>。建議現在把筆記再看一次。</p>`}
      <div class="row" style="justify-content:center">${ok?"":`<button class="btn" id="note">看筆記</button>`}<button class="btn ${ok?"":"ghost"}" id="back">回群島地圖</button></div></div>`);
    o.prepend(speak(id,ok?"陛下果然沒忘，臣很欣慰。":"沒關係，陛下日理萬機。我們退一步，重新記牢。"));
    app.append(o);
    o.querySelector("#back").onclick=()=>viewIsland(is.id);
    if(!ok)o.querySelector("#note").onclick=()=>viewNote(id);
  }
}

/* ---- 畫面：進度備份（匯出／匯入） ---- */
function viewSave(){
  window.scrollTo(0,0);setTheme(null);app.className="wrap";
  const json=JSON.stringify({app:KEY,exported:today(),state},null,1);
  app.innerHTML="";
  const c=$(`<div class="card"><h3>💾 進度備份</h3><p>進度只存在這台裝置的瀏覽器裡。建議每週匯出一次，換手機或電腦時用匯入帶過去。</p>
    <h4>匯出</h4><div class="row"><button class="btn" id="dl">下載備份檔</button><button class="btn ghost" id="cp">複製成文字</button></div>
    <h4>匯入</h4><p style="font-size:14px;margin:4px 0">選擇備份檔，或把備份文字貼在下面。匯入會覆蓋目前的進度。</p>
    <input type="file" id="file" accept=".json,application/json"><textarea id="ta" placeholder="把備份文字貼在這裡" style="margin-top:8px"></textarea>
    <div class="row"><button class="btn" id="imp">匯入並覆蓋</button><button class="btn bad" id="reset">清除全部進度</button><button class="btn ghost" id="back">← 回群島地圖</button></div>
    <p id="msg" style="font-weight:700"></p></div>`);
  app.append(c);
  const msg=(t)=>c.querySelector("#msg").textContent=t;
  c.querySelector("#dl").onclick=()=>{
    try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download="地科群島進度_"+today()+".json";document.body.append(a);a.click();a.remove();msg("已下載備份檔。")}
    catch(e){c.querySelector("#ta").value=json;msg("這個瀏覽器不能下載，請改為複製下方文字自行保存。")}
  };
  c.querySelector("#cp").onclick=()=>{
    c.querySelector("#ta").value=json;c.querySelector("#ta").select();
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(json).then(()=>msg("已複製，請貼到記事本或訊息裡保存。"),()=>msg("請手動複製下方文字。"))}
    else msg("請手動複製下方文字。");
  };
  c.querySelector("#file").onchange=(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{c.querySelector("#ta").value=r.result;msg("已讀入檔案，請按「匯入並覆蓋」。")};r.readAsText(f)};
  c.querySelector("#imp").onclick=()=>{
    try{
      const o=JSON.parse(c.querySelector("#ta").value);
      if(!o||o.app!==KEY||typeof o.state!=="object"||o.state===null) throw new Error("格式不符");
      const ids=new Set(allLevels().map(l=>l.id));const clean={};
      for(const k of Object.keys(o.state)) if(ids.has(k)) clean[k]=o.state[k];
      state=clean;save(state);msg("匯入完成，共 "+Object.keys(clean).length+" 關的紀錄。");
    }catch(e){msg("匯入失敗：內容不是這個網頁的備份。")}
  };
  c.querySelector("#reset").onclick=()=>{if(confirm("確定要清除全部進度嗎？這個動作無法復原，建議先匯出備份。")){state={};save(state);msg("已清除全部進度。")}};
  c.querySelector("#back").onclick=goHome;
}

document.getElementById("homeBtn").onclick=goHome;
document.getElementById("saveBtn").onclick=viewSave;
window.__geo={get state(){return state},today,addDays,passFirst,reviewPass,reviewFail,isDue}; // 驗收測試用
viewMap();
})();
</script>
